notes: "Contains 1,334 fetal-head standard-plane images from 551 pregnant women: 999 training images and 335 test images. The training set provides expert-fitted head-circumference ellipse outlines, physical pixel spacing, and HC measurements in millimetres. The public test set provides images and pixel spacing, while its ellipse annotations and HC ground truth are retained by the challenge organizers for blind evaluation. The stable Zenodo concept DOI resolves to the latest version; record 1322001 is the superseded v1 and the latest version-specific DOI is 10.5281/zenodo.1327317. During verification, both official metadata CSV files from v1 were successfully transferred in full; the image ZIP archives were not downloaded."
