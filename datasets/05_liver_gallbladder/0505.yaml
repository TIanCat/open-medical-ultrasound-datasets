id: "0505"
name: "GBUSV"
full_name: "Gallbladder Ultrasound Video Dataset"

release_year: 2022

anatomy:
  primary: "Gallbladder"
  target:
    - "Gallbladder pathology"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "cine"
  representation:
    - "video"

scale:
  - unit: "video"
    count: 64
  - unit: "frame"
    count: 15800
    note: "Frames extracted from the 64 released videos."

annotations:
  classification:
    unit: "video"
    classes:
      - "Non-malignant"
      - "Malignant"
    distribution:
      Non-malignant: 32
      Malignant: 32
    note: >-
      The malignant videos contain 12,251 frames and the non-malignant videos
      contain 3,549 frames; only video-level labels are native annotations.

tasks:
  - "classification"

access:
  level: "application"
  license: "Custom GBUSV License Agreement"
  requirements:
    - "Redistribution, modification, and commercial use require prior written approval."

paper:
  title: "Unsupervised Contrastive Learning of Image Representations from Ultrasound Videos with Hard Negative Mining"
  venue: "MICCAI 2022"
  doi: "10.1007/978-3-031-16440-8_41"

data:
  repository: "GBUSV project website"
  url: "https://gbc-iitd.github.io/data/gbusv"
  doi: null
  version: null

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-02"
  sources:
    - "https://gbc-iitd.github.io/data/gbusv"
    - "https://doi.org/10.1007/978-3-031-16440-8_41"

notes: >-
  The original release contains 64 videos and 15,800 frames. Videos contain
  43-888 frames and were resized to 360 x 480 pixels. The current application
  agreement is labeled GBUSV v2.0, whereas the project page still documents the
  original 64-video release. Self-supervised representation learning is the
  research paradigm used in the associated paper rather than a native dataset
  task, so only video-level classification is encoded under tasks.
