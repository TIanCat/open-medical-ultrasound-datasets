notes: "Contains 432 normal images from 71 patients, 558 benign images from 100 patients, and 265 malignant images from 47 patients. Expert axis-aligned bounding boxes cover the gallbladder and adjacent liver ROI, with additional boxes for abnormal pathologies. No pixel-wise masks are provided. Requests are limited to permanent employees or faculty; students must apply through a supervisor or department head. Redistribution, modification, and commercial use require prior written approval."
