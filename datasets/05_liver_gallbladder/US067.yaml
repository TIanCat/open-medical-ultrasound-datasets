notes: "The original release contains 64 videos and 15,800 unannotated frames: 12,251 frames from 32 malignant videos and 3,549 frames from 32 non-malignant videos. Videos contain 43–888 frames, resized to 360 × 480 pixels. Only video-level labels are provided. The current application agreement is labeled GBUSV v2.0, whereas the project page still documents the original 64-video release. Redistribution, modification, and commercial use require prior written approval."
