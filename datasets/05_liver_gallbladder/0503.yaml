notes: >-
  The public release contains exactly 735 JPG images: 435 malignant, 200 benign,
  and 100 normal. It is an annotated public subset associated with a larger study
  of 50,063 images and video frames from 11,468 patients; the full study cohorts
  are not publicly included here. Detection is a possible downstream use of the
  polygon annotations, but no independent bounding-box annotation is released,
  so detection is not encoded as a native task.
