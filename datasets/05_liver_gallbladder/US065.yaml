notes: "The public release contains exactly 735 JPG images: 435 malignant, 200 benign, and 100 normal. JSON annotations describe ultrasound scan outlines, liver regions, and liver-mass regions. It is an annotated subset associated with a larger study of 50,063 images and video frames from 11,468 patients; the full study cohorts are not included. The Zenodo record requests that users contact and appropriately credit the authors."
