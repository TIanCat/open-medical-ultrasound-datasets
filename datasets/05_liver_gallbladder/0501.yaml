id: "0501"
name: "Fatty Liver Ultrasound"
full_name: "Dataset of B-mode Fatty Liver Ultrasound Images"

release_year: 2018

anatomy:
  primary: "Liver"
  target:
    - "Hepatic steatosis"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "sequence"
  representation:
    - "image"

scale:
  - unit: "patient"
    count: 55
  - unit: "image"
    count: 550
    note: "Ten consecutive B-mode frames are provided per patient."

annotations:
  classification:
    unit: "patient"
    classes:
      - "Non-fatty liver"
      - "Fatty liver"
    distribution:
      Non-fatty liver: 17
      Fatty liver: 38
    reference_standard: "Wedge-biopsy steatosis percentage"
    note: "Fatty liver is defined as steatosis in more than 5% of hepatocytes."

  measurements:
    unit: "patient"
    targets:
      - "Hepatic steatosis percentage"
    format: "clinical_reference"
    units:
      "Hepatic steatosis percentage": "%"

tasks:
  - "classification"
  - "measurement"

access:
  level: "open"
  license: "CC BY 4.0"
  requirements: []

paper:
  title: "Transfer learning with deep convolutional neural network for liver steatosis assessment in ultrasound images"
  venue: "International Journal of Computer Assisted Radiology and Surgery"
  doi: "10.1007/s11548-018-1843-2"

data:
  repository: "Zenodo"
  url: "https://zenodo.org/records/1009146"
  doi: "10.5281/zenodo.1009146"
  version: null

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-02"
  sources:
    - "https://zenodo.org/records/1009146"
    - "https://doi.org/10.1007/s11548-018-1843-2"

notes: >-
  The dataset contains ten consecutive 434 x 636 B-mode frames from each of
  55 severely obese patients. Wedge-biopsy steatosis percentage is provided as
  the reference standard. Because the continuous biopsy percentage is available,
  the former free-text "Regression" task is represented as a native measurement
  task rather than as a separate research paradigm.
