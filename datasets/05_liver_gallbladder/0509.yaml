id: "0509"
name: "SMC-LUD"
full_name: "Samsung Medical Center Liver Ultrasound Dataset"

release_year: 2026

anatomy:
  primary: "Liver"
  target:
    - "Focal liver lesion"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "static"
  representation:
    - "image"

scale:
  - unit: "patient"
    count: 1021
  - unit: "image"
    count: 5385

annotations:
  classification:
    unit: "image"
    classes:
      - "Hepatocellular carcinoma"
      - "Hemangioma"
    distribution:
      Hepatocellular carcinoma: 2716
      Hemangioma: 2669
    reference_standard: >-
      HCC was histopathologically confirmed by surgical resection or biopsy;
      hemangioma was radiologically diagnosed and reviewed by abdominal radiologists.
    note: >-
      The corresponding patient counts are 600 patients with HCC and
      421 patients with hemangioma.

tasks:
  - "classification"

access:
  level: "open"
  license: "CC BY 4.0 with repository and paper restrictions limiting use to non-commercial research"
  requirements:
    - "Non-commercial research use only."

paper:
  title: "SMC-LUD: Large-Scale B-Mode Liver Ultrasound Dataset for Hepatocellular Carcinoma and Hemangioma Classification"
  venue: "Scientific Data"
  doi: "10.1038/s41597-026-07023-7"

data:
  repository: "Figshare"
  url: "https://doi.org/10.6084/m9.figshare.31112716"
  doi: "10.6084/m9.figshare.31112716"
  version: "3"

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-02"
  sources:
    - "https://doi.org/10.6084/m9.figshare.31112716"
    - "https://doi.org/10.1038/s41597-026-07023-7"

notes: >-
  SMC-LUD contains 5,385 anonymized images from 1,021 patients: 2,716 HCC images
  from 600 patients and 2,669 hemangioma images from 421 patients. HCC metadata
  include tumor size and UICC/AJCC pT stages. Clean and Caliper image subsets are
  provided; no segmentation masks are reported. Figshare displays CC BY 4.0, while
  the repository and paper additionally impose a non-commercial research-only
  restriction, which is recorded explicitly under access.
