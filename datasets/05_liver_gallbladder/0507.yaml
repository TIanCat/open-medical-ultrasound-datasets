id: "0507"
name: "BEHSOF"
full_name: "BEHSOF - Advanced Non-alcoholic Fatty Liver Dataset with Clinical Metadata and Ultrasound Images for Deep Learning Models"

release_year: 2024

anatomy:
  primary: "Liver"
  target:
    - "Non-alcoholic fatty liver disease"

modality:
  type:
    - "Ultrasound"
    - "Elastography"
  dimension: "2D"
  temporal: "static"
  representation:
    - "image"

scale:
  - unit: "participant"
    count: 113
  - unit: "image"
    count: 1669
    note: >-
      This image count comes from a derived public curation and is not stated
      as the original Figshare image count.

annotations:
  grading:
    unit: "participant"
    system: "Steatosis and FibroScan staging"
    label_sets:
      steatosis:
        categories:
          - "Stage 0"
          - "Stage 1"
          - "Stage 2"
          - "Stage 3"
        distribution:
          Stage 0: 12
          Stage 1: 57
          Stage 2: 36
          Stage 3: 8
      fibrosis:
        categories:
          - "F0"
          - "F1"
          - "F2"
        distribution:
          F0: 24
          F1: 78
          F2: 11
    note: "Steatosis and FibroScan fibrosis stages are provided at participant level."

  measurements:
    unit: "participant"
    targets:
      - "CAP score"
      - "Elasticity score"
      - "Anthropometric measurements"
      - "Blood-test measurements"
    format: "clinical_metadata"

tasks:
  - "grading"
  - "measurement"

access:
  level: "open"
  license: "CC BY 4.0"
  requirements: []

paper: null

data:
  repository: "Figshare"
  url: "https://figshare.com/articles/dataset/BEHSOF/26389069"
  doi: "10.6084/m9.figshare.26389069.v4"
  version: "4"

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-02"
  sources:
    - "https://figshare.com/articles/dataset/BEHSOF/26389069"
    - "https://doi.org/10.6084/m9.figshare.26389069.v4"

notes: >-
  BEHSOF contains 113 participants: 18 from Taleghani Hospital and 95 from
  Behbood Clinic. Clinical data include demographics, anthropometric measurements,
  blood tests, CAP score, elasticity/E score, and FibroScan results. The original
  free-text tasks "Regression" and "Multimodal Prediction" are downstream modeling
  formulations; the native structured supervision is represented here as grading
  and measurement metadata.
