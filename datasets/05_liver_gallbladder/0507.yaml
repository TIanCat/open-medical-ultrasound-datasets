notes: "Contains 113 participants: 18 from Taleghani Hospital and 95 from Behbood Clinic. The derived image curation contains 1,669 images. Steatosis stages 0/1/2/3 contain 12/57/36/8 participants; FibroScan fibrosis stages F0/F1/F2 contain 24/78/11. Clinical data include demographics, anthropometric measurements, blood tests, CAP score, elasticity/E score, and FibroScan results. The 1,669-image count comes from a derived Kaggle curation and is not stated for the original Figshare release."
