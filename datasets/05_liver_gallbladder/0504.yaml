id: "0504"
name: "GBCU"
full_name: "Gallbladder Cancer Ultrasound Dataset"

release_year: 2022

anatomy:
  primary: "Gallbladder"
  target:
    - "Gallbladder"
    - "Gallbladder pathology"
    - "Adjacent liver region"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "static"
  representation:
    - "image"

scale:
  - unit: "patient"
    count: 218
  - unit: "image"
    count: 1255

annotations:
  classification:
    unit: "image"
    classes:
      - "Normal"
      - "Benign"
      - "Malignant"
    distribution:
      Normal: 432
      Benign: 558
      Malignant: 265
    note: >-
      The corresponding patient counts are 71 normal, 100 benign, and
      47 malignant patients.

  detection:
    unit: "image"
    targets:
      - "Gallbladder and adjacent liver ROI"
      - "Gallbladder pathology"
    format: "bounding_box"
    note: >-
      Expert axis-aligned boxes cover the gallbladder and adjacent liver ROI,
      with additional boxes for abnormal pathologies.

tasks:
  - "classification"
  - "detection"

access:
  level: "application"
  license: "Custom GBCU License Agreement"
  requirements:
    - "Requests are limited to permanent employees or faculty."
    - "Students must apply through a supervisor or department head."
    - "Redistribution, modification, and commercial use require prior written approval."

paper:
  title: "Surpassing the Human Accuracy: Detecting Gallbladder Cancer From USG Images With Curriculum Learning"
  venue: "CVPR 2022"
  doi: "10.1109/CVPR52688.2022.02022"

data:
  repository: "GBCU project website"
  url: "https://gbc-iitd.github.io/data/gbcu"
  doi: null
  version: null

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-02"
  sources:
    - "https://gbc-iitd.github.io/data/gbcu"
    - "https://doi.org/10.1109/CVPR52688.2022.02022"

notes: >-
  GBCU contains 1,255 B-mode gallbladder ultrasound images from 218 patients.
  No pixel-wise segmentation masks are provided; the spatial supervision consists
  of expert bounding boxes. Access is application-based under the custom GBCU
  license agreement.
