notes: "The complete Version 2 contains 120 studies, 120 series, and 1,859 DICOM instances totaling 272.16 GB. Clinical diagnosis, treatment, and follow-up data are provided. Lesion characterization reference standards include pathology and contrast-enhanced cross-sectional imaging. Treatment-response reference standards are available for many HCC cases. No consistent bounding-box or pixel-wise lesion annotations are released."
