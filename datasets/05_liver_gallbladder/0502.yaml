notes: >-
  The complete Version 2 contains 120 studies, 120 series, and 1,859 DICOM
  instances totaling 272.16 GB. Clinical diagnosis, treatment, and follow-up
  data are provided. Lesion characterization reference standards include pathology
  and contrast-enhanced cross-sectional imaging. Treatment-response reference
  standards are available for many HCC cases, but no single standardized
  treatment-response label schema is documented here, so treatment-response
  assessment and temporal analysis are treated as downstream uses rather than
  separate native tasks. No consistent bounding-box or pixel-wise lesion
  annotations are released.
