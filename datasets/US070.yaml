notes: "Contains 10,352 standardized 768 × 1024 PNG images from 384 patients: 8,772 grayscale and 1,580 color images. Full-image labels are based on corresponding liver biopsy results. Steatosis uses grades 0–3; fibrosis uses five categories from no fibrosis through cirrhosis. No bounding boxes, segmentation masks, patient IDs, examination dates, raw NAS scores, or biopsy reports are released. The OSF project and files were not accessible during verification; access requires formal approval and a signed confidentiality agreement and is restricted to non-commercial research."
