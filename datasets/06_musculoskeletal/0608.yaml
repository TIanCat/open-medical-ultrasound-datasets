notes: >-
  This dataset is not currently represented elsewhere in the atlas and is
  suitable for inclusion as a primary musculoskeletal ultrasound resource.
  It originates from the population-based Johnston County Health Study
  (JoCoHS) and was created as an AI/ML-ready FAIR resource for research on
  knee osteoarthritis and related ultrasound phenotypes.

  Associated publications describe a standardized protocol with seven images
  per knee. Expert readers scored osteoarthritis-related ultrasound features
  including effusion/synovitis, Power Doppler signal, osteophytes, cartilage
  damage, meniscal extrusion, popliteal cysts, and calcium crystal deposition,
  with disagreements adjudicated by a third reader. However, the publications
  specifically state that the Harvard Dataverse currently provides all
  ultrasound images and limited metadata. Because public availability of the
  final expert feature scores could not be independently confirmed from the
  currently accessible Dataverse metadata, those scores are not encoded as
  native public annotations in this atlas entry.

  The associated 2025 cohort analysis included 861 participants and 1,711 knees
  with complete imaging data from a 902-participant Johnston County Health Study
  cohort. These study-cohort counts are not used as the public dataset scale
  because the Harvard Dataverse is a versioned resource and the publicly
  summarized resource size is 7,571 ultrasound images.

  The currently accessible indexed Harvard Dataverse information identifies
  version 5.1. A dataset-specific reusable license could not be independently
  confirmed, so access.license is left null. Verification is marked partial
  because the Dataverse landing page could not be fully inspected from the
  verification environment.
