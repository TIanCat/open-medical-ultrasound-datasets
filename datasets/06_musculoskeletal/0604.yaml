paper:
  title: "TUS-REC2024: A Challenge to Reconstruct 3D Freehand Ultrasound Without External Tracker"
  venue: "arXiv"
  doi: "10.48550/arXiv.2506.21765"

data:
  repository: "TUS-REC"
  url: "https://github-pages.ucl.ac.uk/tus-rec-challenge/TUS-REC2024/"
  doi: null
  version: null

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-02"
  sources:
    - "https://github-pages.ucl.ac.uk/tus-rec-challenge/TUS-REC2024/"
    - "https://doi.org/10.48550/arXiv.2506.21765"

notes: >-
  TUS-REC2024 contains 2,040 freehand forearm ultrasound scans from 85 healthy
  volunteers. The native supervision consists of synchronized per-frame 4x4
  spatial transformations. These support relative-pose estimation, spatial
  registration, and trackerless 3D reconstruction, which are retained as the
  three native technical tasks.
