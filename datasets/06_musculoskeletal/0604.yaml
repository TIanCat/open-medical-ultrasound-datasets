id: "0604"
name: "TUS-REC2024"
full_name: "TUS-REC2024: Trackerless Ultrasound Reconstruction Challenge 2024"

release_year: 2024

anatomy:
  primary: "Musculoskeletal"
  target:
    - "Forearm"
    - "Freehand ultrasound scan geometry"

