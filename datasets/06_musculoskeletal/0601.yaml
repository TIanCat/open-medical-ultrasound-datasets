  primary: "Musculoskeletal"
  target:
    - "Lumbar multifidus muscle"
    - "Left lumbar multifidus at L5"
    - "Right lumbar multifidus at L5"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "static"
  representation:
    - "image"

scale:
  - unit: "subject"
    count: 109
    note: "Images cover left and right sides at L5 in prone and standing positions."

annotations:
  segmentation:
    unit: "image"
    type: "binary"
    targets:
      - "Lumbar multifidus muscle"
    format: "mask"
    note: "Manual binary lumbar-multifidus masks are paired with B-mode images."

tasks:
  - "segmentation"

access:
  level: "open"
  license: "CC BY 4.0"
  requirements: []

paper:
  title: "LUMINOUS Database: Lumbar Multifidus Muscle Segmentation from Ultrasound Images"
  venue: "BMC Musculoskeletal Disorders"
  doi: "10.1186/s12891-020-03679-3"

data:
  repository: "Sonography.ai"
  url: "http://data.sonography.ai/"
  doi: null
  version: null

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-02"
  sources:
    - "http://data.sonography.ai/"
    - "https://doi.org/10.1186/s12891-020-03679-3"

notes: >-
  LUMINOUS contains 109 subject datasets with left- and right-sided lumbar
  multifidus ultrasound images acquired at L5 in prone and standing positions.
  Cross-sectional area and echo-intensity quantification can be derived from the
  images and masks, but the native released supervision is muscle segmentation,
  so those analyses are not encoded as separate tasks.
