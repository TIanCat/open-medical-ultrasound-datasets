notes: >-
  FALLMUD contains 812 B-mode ultrasound images and combines two earlier image
  sets with complementary fascicle and aponeurosis masks. It is therefore
  recorded as an aggregate resource rather than a new independent acquisition.
  Muscle-architecture quantification is a downstream use derived from these
  segmentation masks and is not encoded as a separate native task.
