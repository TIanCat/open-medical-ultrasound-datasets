notes: >-
  The public deepMTJ test set contains 1,344 B-mode ultrasound images acquired
  with three ultrasound systems. Ground truth is defined from four specialist
  annotations. The associated study evaluates MTJ tracking and cross-device
  generalization, but the released annotation itself is per-image MTJ localization;
  tracking and benchmark generalization are therefore not encoded as separate
  native tasks.
