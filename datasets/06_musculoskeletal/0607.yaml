notes: >-
  The resource includes 223 handheld and 375 robot-assisted lumbar-spine
  ultrasound scans. The 6,091 expert-annotated frames comprise 2,353 handheld
  and 3,738 robot-assisted frames selected from nine volunteers. Paired CT scans,
  synchronized ultrasound tracking data, and CT-derived 3D vertebral surface
  models support registration and reconstruction. The former empty classification
  block has been removed because no native classification labels are described.
