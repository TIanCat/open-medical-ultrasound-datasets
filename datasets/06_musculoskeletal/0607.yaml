notes: "Includes 223 handheld and 375 robot-assisted ultrasound scans. The 6,091 expert-annotated frames comprise 2,353 HUS and 3,738 RUS frames selected from nine volunteers. Raw ultrasound frames include synchronized spatial tracking data; paired CT scans and CT-derived 3D vertebral surface models are also provided."
