notes: >-
  The dataset contains 25,005 B-mode ultrasound images from 290 participants,
  including 180 healthy participants and 110 participants with FSHD. Healthy-versus-FSHD
  analysis is represented by the participant-level classification labels, while
  Heckmatt grading and muscle segmentation are encoded separately according to
  their native annotations.
