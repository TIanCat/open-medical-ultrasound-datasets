notes: >-
  This resource contains only 10 static images: six COVID-19, three
  bacterial-pneumonia, and one normal image, associated with eight distinct
  patient/source IDs. File-level verification showed that all 10 images are
  byte-identical to same-named files in atlas dataset 0401. It is therefore
  recorded as an exact subset of 0401 rather than as an independent derivative.
  The Figshare record itself contains no provenance statement, label table,
  patient metadata, selection criteria, bounding boxes, or segmentation masks.
