notes: "The repository README reports 242 videos and 29,651 processed frames. Its current four-class and LUSS files contain 243 records: 72 COVID-19, 49 non-COVID pneumonia, 28 normal, and 94 other-condition records. The published paper describes v1.5 as 173 videos and 21,570 frames from 147 patients, whereas the repository history associates 242 videos and 29,651 frames with v1.4 and describes v1.5 as adding LUSS. Numeric LUSS values are available for 173 current metadata records; 69 are marked NA and one is blank. Repository masks remove embedded text and symbols and are not anatomical segmentation labels. The repository does not host the original videos; its scripts retrieve media from nine external public sources."
