notes: "Contains 2,756 B-mode ultrasound images from 2,756 unique patients, with one image per patient: 1,755 malignant and 1,001 benign. Expert annotations include pixel-level pulmonary tumor masks, while benign/malignant labels are confirmed through biopsy pathology. The public Figshare v1 record provides images.zip, masks.zip, and five_fold_split.xlsx under CC BY 4.0. During verification, five_fold_split.xlsx was successfully transferred in full (HTTP 200; 452,323 bytes); the large image and mask archives were not downloaded in full. The previous Figshare record 30278779 is unavailable."
