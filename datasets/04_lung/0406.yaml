notes: >-
  PU2756 contains 2,756 B-mode pulmonary-ultrasound images from 2,756 unique
  patients, with one image per patient: 1,755 malignant and 1,001 benign.
  Expert annotations include pixel-level pulmonary-tumor masks, while
  benign/malignant labels are confirmed through biopsy pathology. The public
  Figshare v1 record provides images.zip, masks.zip, and five_fold_split.xlsx.
  The five-fold partition is retained in the release metadata but is not encoded
  as a single train/validation/test split in this atlas entry.
