notes: "Contains 564 manually annotated frames generated from two-second cine loops acquired from a COVID-19 lung ultrasound training phantom using multiple diagnostic ultrasound systems. Polygon annotations were converted into pixel-wise semantic masks for five foreground targets: ribs, pleural line, A-lines, B-lines, and B-line confluence. Five annotators labelled 100 images each; a senior sonographer labelled another 64 images, with peer review for consistency. The repository provides a 135 MB VideoClips archive, a 91 MB LUS_model train/test and model archive, and a MATLAB frame-extraction script under CC BY 4.0. The archive endpoint was verified using a one-byte range request; the full archive was not downloaded. No patient data are included. The separate clinical transfer-learning dataset described in the paper is available only upon request and is outside this public dataset."
