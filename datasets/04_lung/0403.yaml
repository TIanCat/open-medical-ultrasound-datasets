id: "0403"
name: "LUSS_phantom"
full_name: "Lung Ultrasound COVID Phantom Dataset Used for Training a Machine Learning Model"

release_year: 2024

anatomy:
  primary: "Lung phantom"
  target:
    - "Ribs"
    - "Pleural line"
    - "A-lines"
    - "B-lines"
    - "B-line confluence"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "mixed"
  representation:
    - "video"
    - "image"

scale:
  - unit: "image"
    count: 564
    note: "Manually annotated frames extracted from phantom cine loops."

annotations:
  segmentation:
    unit: "image"
    type: "multiclass"
    targets:
      - "Ribs"
      - "Pleural line"
      - "A-lines"
      - "B-lines"
      - "B-line confluence"
    format: "mask"
    count: 564
    annotators:
      - "Five annotators"
      - "Senior sonographer"
    annotation_method: >-
      Polygon annotations were converted into pixel-wise semantic masks;
      annotations were peer reviewed for consistency.

tasks:
