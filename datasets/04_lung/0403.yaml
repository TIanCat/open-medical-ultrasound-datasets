  level: "open"
  license: "CC BY 4.0"
  requirements: []

paper:
  title: "Deep learning for real-time multi-class segmentation of artefacts in lung ultrasound"
  venue: "Ultrasonics"
  doi: "10.1016/j.ultras.2024.107251"

data:
  repository: "University of Leeds Research Data Repository"
  url: "https://doi.org/10.5518/1485"
  doi: "10.5518/1485"
  version: null

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-02"
  sources:
    - "https://doi.org/10.5518/1485"
    - "https://doi.org/10.1016/j.ultras.2024.107251"

notes: >-
  The dataset contains 564 manually annotated frames generated from two-second
  cine loops acquired from a COVID-19 lung-ultrasound training phantom using
  multiple diagnostic ultrasound systems. Five annotators labelled 100 images
  each and a senior sonographer labelled another 64 images. B-line artefact
  quantification is a downstream use derived from the segmentation masks rather
  than a separate native annotation task. No patient data are included. The
  separate clinical transfer-learning dataset described in the paper is available
  only upon request and is outside this public resource.
