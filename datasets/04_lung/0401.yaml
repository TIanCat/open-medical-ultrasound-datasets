notes: "The stable paper release contains 261 recordings from 216 patients: 202 videos and 59 static images. It contains 92 COVID-19, 73 bacterial-pneumonia, 90 healthy, and 6 non-COVID viral-pneumonia recordings assembled from 41 sources. The continuously updated metadata currently lists 374 source records: 271 videos and 103 images. Not every listed record is directly hosted because access and redistribution rights differ by source. Disease labels and visible LUS patterns were reviewed by medical experts. Four-level lung severity scores were later added for 136 videos. A-line, B-line, and consolidation segmentation annotations for 50 selected records are provided through the external PULSE Lab dataset. The optional uninformative class is an auxiliary out-of-distribution resource, not a core diagnostic class. Patient- or video-level splitting is required to prevent frame-level data leakage."
