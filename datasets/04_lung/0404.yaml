notes: >-
  The dataset contains 1,062 images from 149 Ugandan patients: 338 images from
  27 patients classified as probably COVID-19, 362 images from 67 patients with
  other lung disease, and 362 images from 55 healthy-lung patients. The patient-level
  split contains 723 training, 198 validation, and 141 test images. Mendeley version 2
  adds the original unprocessed data together with processing, cleaning, and sorting scripts.
