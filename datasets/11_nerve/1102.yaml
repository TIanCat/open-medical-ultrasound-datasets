notes: >-
  UBPD was constructed from 101 patients for multi-structure segmentation
  in brachial plexus ultrasound. Professional anesthesiologists acquired
  the ultrasound data and manually annotated the brachial plexus nerve,
  muscle, vein, and artery using LabelMe. The paper contains an internal
  inconsistency in dataset size: the abstract, highlights, and contribution
  summary state 1,055 images, whereas Section 3 states 1,052 images and the
  reported experimental split contains 955 training plus 97 test images,
  also totaling 1,052. Therefore, 1,052 is used as the canonical image count.
  The original author-hosted dataset website was unreachable during
  verification on 2026-09-04. A current secondary ultrasound-dataset catalog
  describes the resource as requiring citation and contact with administrators
  for specific research-use terms; because the original access terms and files
  could not be independently inspected, the license is left null and
  verification.status is set to partial.