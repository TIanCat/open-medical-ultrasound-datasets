notes: "Contains only 10 static images: six COVID-19, three bacterial-pneumonia, and one normal image. Upstream POCUS metadata associates them with eight distinct patient/source IDs. All 10 files were downloaded in memory during verification; their computed MD5 values matched the Figshare API checksums and the same-named files in US072 exactly. The Figshare record contains no provenance statement, label table, patient metadata, selection criteria, bounding boxes, or segmentation masks. Categories are recovered from the filenames and US072 metadata. Figshare applies CC BY 4.0, while the upstream records have differing source-specific licenses and one lacks a stated license."
