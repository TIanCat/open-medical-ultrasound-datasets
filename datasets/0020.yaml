verified:
  date: 2026-09-04
  methods:
    - Read the current TCIA collection page, detailed annotation instructions, version history, and access table
    - Confirmed the formal dataset title, version, dates, creators, DOI, and CC BY 4.0 license through DataCite
    - Downloaded the current TCIA manifest and metadata digest and matched all 4,819 unique Series Instance UIDs exactly
    - Reconciled current and v1 series and DICOM-instance totals by modality and release date
    - Parsed every row in the Target Data and Biopsy Data spreadsheets and checked referenced series against the image digest
    - Verified ZIP/XML integrity of all three downloaded XLSX files and confirmed they contain no formulas
    - Confirmed the dataset-authors' recommended paper metadata in Crossref
    - Did not claim pixel-level verification because the 79.61 GB DICOM collection was not downloaded
  sources:
    - https://www.cancerimagingarchive.net/collection/prostate-mri-us-biopsy/
    - https://doi.org/10.7937/TCIA.2020.A61IOC1A
    - https://doi.org/10.1016/j.juro.2012.08.095

notes: Version 2 contains 1,151 subjects, 1,762 three-dimensional TRUS series and 3,057 MR series. MRI is available for 842 subjects, while all 1,151 have TRUS. The release provides linked prostate/target surfaces, biopsy trajectories and per-core pathology, but US target surfaces are MRI targets transferred through nonrigid registration with reported 3-4 mm average accuracy. The recommended 2013 paper is a clinical reference rather than a dedicated descriptor of the full TCIA release. No official machine-learning split is provided.
