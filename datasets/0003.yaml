id: US003
name: Medical Image Database
aliases:
  - MID
release_year: 2018
release_year_basis: Associated paper publication year; no independent dataset release date was identified

anatomy:
  primary: Breast
  target: Breast lesion

modality:
  type: B-mode ultrasound
  dimension: 2D
  temporal: static
  scope: Paper cohort
  related_website_sections:
    - Doppler ultrasound
    - Elastography

scale:
  paper_experiment:
    test_images: 180
    test_patients: 180
    tuning_images: 15
    tuning_note: Randomly selected from the database and excluded from the 180-image test set
    test_set_distribution:
      breast_cancer: 60
      cyst: 60
      fibroadenoma: 60
    image_resolution: 200 x 200 to 300 x 400 pixels
  website_snapshot:
    checked: 2026-09-03
    ultrasound_table_entries: 296
    ultrasound_unique_detail_page_ids: 275
    ground_truth_table_entries: 252
    ground_truth_unique_detail_page_ids: 215
    note: The live catalog contains repeated views and incompletely described records; these entry counts are not interchangeable with the paper cohort.

annotations:
  segmentation:
    available: true
    type: Lesion contour
    target: Breast lesion
    annotators: Three experts from the Department of Radiology, Thammasat University
    consensus: Two-out-of-three majority vote
    website_delivery: An inspected website sample used a contour-overlaid JPEG; no separate binary-mask archive was identified
  lesion_categories:
    available: true
    paper_test_groups:
      - Breast cancer
      - Cyst
      - Fibroadenoma
    note: The paper reports these groups for evaluation; it does not define an official classification benchmark or split.

tasks:
  - Breast lesion segmentation
  - Automatic initialization and evaluation of active-contour and level-set methods
  - Lesion-type classification as a derived use only

access:
  level: open
  registration_required: false
  license: Not specified
  terms: The website states that images are free to download for training and verification of image-segmentation algorithms and requests citation of the associated paper.
  delivery: Individual JPEG images through the website
  bulk_download: Not identified
  limitations:
    - The website used a self-signed HTTPS certificate when checked on 2026-09-03

paper:
  title: Automatic initialization of active contours and level set method in ultrasound images of breast abnormalities
  authors:
    - Annupan Rodtook
    - Khwunta Kirimasthong
    - Wanrudee Lohitvisate
    - Stanislav S. Makhanov
  venue: Pattern Recognition
  publication_year: 2018
  volume: 79
  pages: 172-182
  doi: 10.1016/j.patcog.2018.01.032

data:
  repository: Online Medical Images
  url: https://www.onlinemedicalimages.com/index.php/en/site-map
  introduction_url: https://www.onlinemedicalimages.com/index.php/en/81-site-info/73-introduction
  ground_truth_url: https://www.onlinemedicalimages.com/index.php/en/example-pages
  related_modalities:
    doppler_url: https://www.onlinemedicalimages.com/index.php/en/sample-sites
    elastography_url: https://www.onlinemedicalimages.com/index.php/en/elastography

acquisition:
  institution: Thammasat University Hospital, Thailand
  scanner: Philips iU22
  transducer: Not reported
  frequency: Not reported

family:
  type: primary
  parent: null

verified:
  date: 2026-09-03
  methods:
    - Read the full paper PDF hosted by the official dataset website and cross-checked its metadata with Crossref
    - Inspected the live ultrasound and ground-truth catalogs and a directly linked ultrasound/contour image pair
    - Cross-checked a peer-reviewed systematic dataset review
  sources:
    - https://doi.org/10.1016/j.patcog.2018.01.032
    - https://www.onlinemedicalimages.com/images/medical/publications/paper_3.pdf
    - https://www.onlinemedicalimages.com/index.php/en/81-site-info/73-introduction
    - https://www.onlinemedicalimages.com/index.php/en/site-map
    - https://www.onlinemedicalimages.com/index.php/en/example-pages
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC10830496/

notes: MID is an abbreviation used in later literature; the original website calls the resource Medical Image Database, and the original paper does not define the acronym. The paper reports no histopathological confirmation, patient demographics, or official train/test split. Its main test set contains 180 images from 180 patients, while 15 additional database images were used only for parameter tuning.
