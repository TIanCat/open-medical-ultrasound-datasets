id: US015
name: BUS-UCLM
full_name: "BUS-UCLM: Breast ultrasound lesion segmentation dataset"
release_year: 2024
release_year_basis: Mendeley Data version 1 was published on 2024-02-26; version 3 and the data-descriptor paper followed in 2025

anatomy:
  primary: Breast
  target: Normal breast tissue and benign or malignant breast lesions

modality:
  type: Ultrasound
  dimension: 2D cross-sectional views
  temporal: static
  released_format: RGB PNG
  source_format: DICOM before anonymization and conversion; source DICOM is not publicly released
  acquisition_system: Siemens ACUSON S2000
  probe: 18L6 HD
  beamforming: standard
  metadata_flags:
    doppler_yes: 36
    doppler_y: 1
    doppler_no: 646
    note: INFO.csv uses both Yes and Y; these are reported as 37 Doppler-marked records without silently normalizing the source file
  released_dimensions:
    info_csv: 856 x 606 pixels for all 683 rows
    inspected_public_png: 856 x 606 pixels
    paper_statement: 768 x 1024 pixels
    caution: The paper and released v3 files disagree; the cause was not established

scale:
  patients: 38
  images: 683
  masks: 683
  class_distribution_images:
    normal: 419
    benign: 174
    malignant: 90
  patient_identifier: Four-letter filename prefix
  patient_class_combinations:
    benign_and_normal: 18
    malignant_and_normal: 10
    benign_malignant_and_normal: 5
    normal_only: 2
    malignant_only: 2
    benign_only: 1

annotations:
  image_labels:
    available: true
    classes:
      - Normal
      - Benign
      - Malignant
    unit: image
  segmentation_masks:
    available: true
    format: RGB PNG
    one_same_named_mask_per_image: true
    colors:
      "255,0,0": Malignant lesion
      "0,255,0": Benign lesion
      "0,0,0": Background, normal breast tissue, or other non-lesion area
    normal_masks: 419 identical all-background masks according to file hashes and labels
  annotators: One radiologist delineated lesions; a second radiologist reviewed and approved them by consensus
  diagnostic_reference: The paper states that lesion malignancy was verified by biopsy
  metadata_file:
    name: INFO.csv
    delimiter: semicolon
    columns:
      - Image
      - Resolution
      - Label
      - Doppler
      - Marks
      - Combined
    marks_yes: 154
    combined_yes: 6

tasks:
  - Normal-versus-benign-versus-malignant image classification
  - Multiclass semantic breast-lesion segmentation
  - Instance segmentation or lesion detection derived from the masks

splits:
  reusable_official_split_file: false
  paper_technical_validation: 90% of cases for training and 10% for testing, partitioned at patient level
  caution: The identities assigned to the paper's split are not provided in the public release
  patient_grouping_available: true

access:
  level: open
  registration_required: false for tested public file URLs
  latest_version: 3
  latest_version_license: CC BY 4.0
  version_1_license: CC BY-NC 3.0
  caution: License changed between versions; cite and follow the license of the version used

ethics_and_acquisition:
  institution: Ciudad Real General University Hospital, Spain
  acquisition_period: 2022-2023
  ethics_approval: Ethics Committee of Ciudad Real General University Hospital, project PID2021-127567NB-I00
  informed_consent: Obtained from all participants for data collection and sharing, according to the paper
  deidentification: Random patient prefixes, anonymized DICOM headers, and black overlays over detected sensitive pixel text; only PNG files are shared
  selection_criteria: Paper reports no predefined patient or image selection criteria

paper:
  title: "BUS-UCLM: Breast ultrasound lesion segmentation dataset"
  authors:
    - Noelia Vallez
    - Gloria Bueno
    - Oscar Deniz
    - Miguel Angel Rienda
    - Carlos Pastor
  venue: Scientific Data
  volume: 12
  article_number: 242
  publication_year: 2025
  doi: 10.1038/s41597-025-04562-3

data:
  repository: Mendeley Data
  landing_page: https://data.mendeley.com/datasets/7fvgj4jsp7/3
  doi: 10.17632/7fvgj4jsp7.3
  version: 3
  publication_date: 2025-01-27
  initial_version:
    version: 1
    publication_date: 2024-02-26
    doi: 10.17632/7fvgj4jsp7.1
  code_repository: https://github.com/noeliavallez/BUS-UCLM-Dataset

quality_checks:
  public_file_tree:
    image_png_files: 683
    mask_png_files: 683
    info_csv_rows: 683
  unique_image_filenames: 683
  unique_mask_filenames: 683
  unique_info_csv_names: 683
  image_mask_name_sets_equal: true
  image_info_name_sets_equal: true
  unique_image_sha256_hashes: 683
  unique_mask_sha256_hashes: 265
  repeated_mask_hash_explanation: One hash occurs 419 times and corresponds exactly to all normal all-background masks
  sample_pair_checked:
    filename: ALWI_000.png
    image_dimensions: 856 x 606
    mask_dimensions: 856 x 606
    image_mode: RGB
    mask_mode: RGB

family:
  type: primary
  parent: null

verified:
  date: 2026-09-03
  methods:
    - Read Mendeley metadata for versions 1 and 3 and the 2025 Scientific Data descriptor
    - Enumerated the official v3 Mendeley folder tree and all file metadata
    - Parsed every INFO.csv row and checked patient prefixes, class counts, and metadata flags
    - Matched all 683 image, mask, and INFO.csv filenames exactly
    - Checked SHA-256 uniqueness from the official file manifest
    - Downloaded one official image-mask pair and inspected its dimensions and color mode
    - Preserved the unresolved resolution discrepancy between the paper and the public files
  sources:
    - https://data.mendeley.com/datasets/7fvgj4jsp7/3
    - https://data.mendeley.com/public-api/datasets/7fvgj4jsp7/snapshot/3
    - https://doi.org/10.1038/s41597-025-04562-3
    - https://www.nature.com/articles/s41597-025-04562-3
    - https://github.com/noeliavallez/BUS-UCLM-Dataset

notes: The latest release provides 683 unique ultrasound PNGs and 683 same-named masks from 38 patients. The 419, 174, and 90 counts are image-level normal, benign, and malignant labels, not patient counts. Normal images have all-background masks. The formal paper supports classification, segmentation, and mask-derived detection, but it does not publish a reusable official split. The public v3 files are 856 x 606 even though the paper states 768 x 1024.
