notes: "Contains 5,385 anonymized images from 1,021 patients: 2,716 HCC images from 600 patients and 2,669 hemangioma images from 421 patients. Labels are image-level and data are grouped by patient. HCC diagnoses were histopathologically confirmed through surgical resection or biopsy; hemangiomas were radiologically diagnosed and reviewed by abdominal radiologists. HCC metadata include tumor size and UICC/AJCC pT stages. Clean and Caliper image subsets are provided; no segmentation masks are reported. Figshare displays CC BY 4.0, but both the repository and paper impose a non-commercial research-only restriction. The current v3 record provides one 1,328,048,074-byte ZIP. Its download endpoint was verified with a one-byte range request; the complete archive was not downloaded."
