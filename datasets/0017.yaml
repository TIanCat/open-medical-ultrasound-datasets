quality_checks:
  official_bulk_archive:
    enumerated_entries: 2200
    image_png_files: 1100
    mask_png_files: 1100
    image_mask_filename_sets_equal: true
  file_api_limit_observed:
    returned_per_folder: 1000
    effect: The API listing alone omits 100 files from each folder; the complete bulk archive was used for counts
  first_1000_manifest_checks:
    unique_image_names: 1000
    unique_mask_names: 1000
    matching_name_sets: true
    unique_image_sha256_hashes: 1000
    unique_mask_sha256_hashes: 1000
  sample_pair_checked:
    filename: 202201121748100022VAS_slice_1069.png
    image_dimensions: 709 x 749
    mask_dimensions: 709 x 749
    image_color_space: RGB
    mask_color_space: Grayscale
    visual_review: The mask is a filled binary arterial region; visual inspection does not establish the precise anatomical contour convention

family:
  type: primary
  parent: null

verified:
  date: 2026-09-03
  methods:
    - Read the official Mendeley v1 metadata and version list
    - Enumerated both folder manifests and identified the 1,000-file API response cap
    - Enumerated the complete bulk ZIP directory to confirm 1,100 plus 1,100 PNG files
    - Compared all filenames in the complete archive and confirmed exact image-mask pairing
    - Checked name and SHA-256 uniqueness for the 1,000 entries exposed by each folder API response
    - Downloaded, dimension-checked, and visually inspected one official image-mask pair
    - Queried Crossref without identifying a dedicated dataset descriptor
  sources:
    - https://data.mendeley.com/datasets/d4xt63mgjm/1
    - https://data.mendeley.com/public-api/datasets/d4xt63mgjm/snapshot/1
    - https://doi.org/10.17632/d4xt63mgjm.1

notes: The release year is 2022, not 2023. The complete dataset has 1,100 image-mask pairs from 11 subjects; the public folder API returns only 1,000 entries per folder, so its first response must not be mistaken for the full dataset. The record supports artery-region segmentation and geometry measurement but does not define the exact anatomical mask boundary, provide diagnosis labels, or publish an official split.
