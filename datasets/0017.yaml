id: US017
name: Common Carotid Artery Ultrasound Images
aliases:
  - CCAUI
alias_note: CCAUI is a catalog shorthand; it is not used as the formal title in the Mendeley record
release_year: 2022
release_year_basis: Mendeley Data version 1 was published on 2022-11-14

anatomy:
  primary: Common carotid artery
  view: Transverse examples are visible in the released data, but the record does not formally enumerate view categories
  mask_target: Common carotid artery region
  boundary_caution: The official metadata does not define whether the contour represents lumen-intima, outer wall, or another anatomical boundary

modality:
  type: Ultrasound
  dimension: 2D frames extracted from DICOM time series
  temporal_release: static PNG frames
  imaging_mode: Not explicitly identified as B-mode in the dataset record
  released_image_format: PNG
  released_image_shape: 709 x 749 x 3 according to the record
  inspected_image:
    width_pixels: 709
    height_pixels: 749
    color_space: RGB
  inspected_mask:
    width_pixels: 709
    height_pixels: 749
    color_space: Grayscale
  source_system_as_recorded: Mindary UMT-500Plus
  source_system_note: The record spelling is preserved; the manufacturer/model name was not independently normalized
  probe: L13-3s linear probe
  acquisition_presets:
    vascular_subjects_reported: 2
    carotid_subjects_reported: 8
    subjects_total: 11
    caution: The preset counts cover only 10 of the 11 subjects; the remaining subject is not explained

scale:
  subjects: 11
  images_per_subject: 100
  ultrasound_images: 1100
  masks: 1100
  total_png_files: 2200
  examinations: Each subject was examined at least once on the left and right sides
  subject_demographics: Not provided

annotations:
  segmentation_masks:
    available: true
    type: binary region mask
    one_same_named_mask_per_image: true
    initial_annotator: Technician
    verification: Expert
    exact_boundary_definition: Not provided
  diagnostic_labels: false
  clinical_metadata: false

tasks:
