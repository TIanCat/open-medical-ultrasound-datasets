notes: The dataset was released in 2023, while the associated journal article appears in the January 2024 issue. The official record does not report patient count, acquisition details, diagnostic reference standard, or an official split. A checked public mirror contains 811 complete filename pairs, but mask 0319.png is one pixel wider than its image; users should inspect or correct that pair before training.
