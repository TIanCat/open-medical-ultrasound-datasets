id: US086
name: ACOUSLIC-AI
full_name: Abdominal Circumference Operator-agnostic UltraSound measurement in Low-Income Countries using Artificial Intelligence
release_year: 2024

anatomy:
  primary: Fetus
  target: Fetal abdomen

modality:
  type: B-mode
  dimension: 2D
  temporal: sequence

scale:
  images: 252000
  patients: 300

annotations:
  classification:
    num_classes: 2
    classes:
      - Optimal plane
      - Suboptimal plane

  segmentation:
    available: true
    targets:
      - Fetal abdomen

tasks:
  - Frame localization
  - Semantic segmentation
  - Abdominal circumference measurement

access:
  level: open
  license: CC BY-NC-SA 4.0

paper:
  title: "ACOUSLIC-AI challenge report: Fetal abdominal circumference measurement on blind-sweep ultrasound data from low-income countries"
  venue: Medical Image Analysis
  doi: 10.1016/j.media.2025.103640

data:
  repository: Zenodo
  url: https://doi.org/10.5281/zenodo.12697994
  data_doi: 10.5281/zenodo.12697994

family:
  type: primary
  parent: null

verified:
  date: 2026-09-03

notes: >-
  Zenodo version 1.1 publicly distributes the 300-case training set. Each
  case contains 840 frames covering six blind sweeps, giving 252,000 public
  frames. The complete challenge comprises 592 cases: 300 training, 10
  validation, and 282 test cases; validation and test data are private.
  Mask value 1 denotes an optimal plane and value 2 a suboptimal plane.
  Version 1.1 corrects circumference measurements that were twice too large
  in version 1.0. The Zenodo file endpoint was verified using a 1 KB range
  request; the full 38 GB archive was not downloaded.
