notes: >-
  MIMIC-IV-Echo v1.0.1 contains 206,488 echocardiography studies from 91,372
  patients. The DICOM subset contains 524,137 files from 7,228 transthoracic
  echocardiography studies and 4,572 patients. The resource links echocardiographic
  imaging and structured measurements to MIMIC-IV. Representation learning,
  view analysis, and multimodal clinical research are important downstream uses,
  but the native structured supervision recorded here is measurement metadata.
