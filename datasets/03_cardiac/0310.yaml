notes: >-
  Native beamspace data before scan conversion: time-resolved 1D, 2D,
  multiplane and 3D B-mode; color, tissue, pulsed-wave and continuous-wave
  Doppler; and synchronized ECG. Geometry, calibration and timestamps are
  retained. Data are distributed as Zarr v2 recording stores inside one
  tar archive per examination, with Croissant metadata and patient-level
  five-fold assignments. The benchmarks include cross-modal Doppler
  estimation, segmentation and ECG-conditioned video generation. This is
  not scanner raw-channel or RF data. Counts follow the current Hugging Face release;
  the arXiv preprint describes an earlier version.
