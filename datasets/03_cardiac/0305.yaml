id: "0305"
name: "EchoNet-LVH"
full_name: "EchoNet-LVH"

release_year: 2022

anatomy:
  primary: "Heart"
  target:
    - "Left ventricle"
    - "Interventricular septum"
    - "Left-ventricular posterior wall"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "cine"
  representation:
    - "video"

scale:
  - unit: "video"
    count: 12000

annotations:
  measurements:
    unit: "video"
    targets:
      - "Interventricular septal thickness"
      - "Left-ventricular internal diameter"
      - "Posterior-wall thickness"
      - "Left-ventricular mass"
    format: "measurement_and_tracing_metadata"
    note: >-
      The release includes expert measurements, tracings, and calculations used
      for left-ventricular hypertrophy phenotyping.

tasks:
  - "measurement"

access:
  level: "application"
  license: "Stanford research-use terms"
  requirements:
    - "Stanford AIMI/Redivis research-use workflow"

paper:
  title: "High-Throughput Precision Phenotyping of Left Ventricular Hypertrophy With Cardiovascular Deep Learning"
  venue: "JAMA Cardiology"
  doi: "10.1001/jamacardio.2021.6059"

data:
  repository: "Stanford AIMI"
  url: "https://aimi.stanford.edu/datasets/echonet-lvh"
  doi: "10.71718/wtrx-wj56"
  version: null

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-02"
  sources:
    - "https://aimi.stanford.edu/datasets/echonet-lvh"
    - "https://doi.org/10.1001/jamacardio.2021.6059"
    - "https://doi.org/10.71718/wtrx-wj56"

notes: >-
  EchoNet-LVH contains 12,000 labeled echocardiography videos. Left-ventricular
  hypertrophy phenotyping is derived from the released cardiac measurements and
  calculations, so the native task is represented as measurement rather than as
  a separate free-text regression or phenotyping task.
