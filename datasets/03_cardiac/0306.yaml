id: "0306"
name: "CardiacUDA / CardiacUDC"
full_name: "CardiacUDA / CardiacUDC"

release_year: 2023

anatomy:
  primary: "Heart"
  target:
    - "Left ventricle"
    - "Right ventricle"
    - "Pulmonary artery"
    - "Cardiac chambers"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "cine"
  representation:
    - "video"

scale:
  - unit: "video"
    count: 992
    note: "Paper-reported full dataset: 516 videos from site G and 476 from site R."
  - unit: "patient"
    count: 100
    approximate: true
    note: "The paper describes approximately 100 patients."

annotations:
  segmentation:
    unit: "frame"
    type: "multiclass"
    targets:
      - "Left ventricle"
      - "Right ventricle"
      - "Pulmonary artery"
      - "Cardiac chambers"
    format: "mask"
    note: >-
      Pixel-wise masks are view-specific. Training labels are sparse, whereas
      validation and test labels are more densely annotated.

tasks:
  - "segmentation"

access:
  level: "open"
  license: "Apache 2.0"
  requirements: []

paper:
  title: "GraphEcho: Graph-Driven Unsupervised Domain Adaptation for Echocardiogram Video Segmentation"
  venue: "ICCV 2023"
  doi: "10.48550/arXiv.2309.11145"

data:
  repository: "Kaggle"
  url: "https://www.kaggle.com/datasets/xiaoweixumedicalai/cardiacudc-dataset"
  doi: null
  version: null

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "partial"
  date: "2026-09-02"
  sources:
    - "https://www.kaggle.com/datasets/xiaoweixumedicalai/cardiacudc-dataset"
    - "https://doi.org/10.48550/arXiv.2309.11145"

notes: >-
  The associated paper describes 992 videos across two sites, while the publicly
  visible Kaggle package currently exposes only the A4C subset. Unsupervised domain
  adaptation and cross-center generalization are experimental paradigms rather than
  native dataset tasks; the released supervision itself is cardiac-structure segmentation.
