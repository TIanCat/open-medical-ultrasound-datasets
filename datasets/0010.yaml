id: US010
name: USenhance 2023
full_name: Ultrasound Image Enhancement Challenge 2023
release_year: 2023
release_year_basis: The challenge-design record was published on 2023-04-18 and the training data were scheduled for release on 2023-07-10

anatomy:
  type: multi-anatomy
  organs:
    - Thyroid
    - Carotid artery
    - Liver
    - Kidney
    - Breast
  terminology_note: The challenge proposal groups liver and kidney as abdomen, while the website and released training folders identify five organs separately

modality:
  type: Ultrasound
  dimension: 2D
  appearance: Grayscale B-mode
  official_mode_wording: The official sources say ultrasound images and do not explicitly use the term B-mode
  released_format: 8-bit grayscale PNG
  released_resolution_pixels: 256 x 256

scale:
  challenge_design_claim:
    patients: 109
    low_high_pairs: 1500
    total_images: 3000
    planned_training_pairs: 1050
    planned_test_pairs: 450
  current_public_downloads:
    training_pairs: 1050
    training_images: 2100
    test_low_quality_images: 364
    test_high_quality_reference_images: 0
    total_image_files: 2464
  patient_count_verifiability: No patient identifiers or patient-to-image mapping are included in the public archives

public_training_distribution:
  breast: 202 pairs
  carotid_artery: 286 pairs
  kidney: 122 pairs
  liver: 149 pairs
  thyroid: 291 pairs

public_test_distribution:
  basis: Inferred from the numeric ID ranges established by the training organ directories; the test archive itself is flat and has no organ manifest
  thyroid: 125 low-quality images
  carotid_artery: 122 low-quality images
  liver: 64 low-quality images
  kidney: 53 low-quality images
  breast: 0 images

reference_generation:
  low_quality_devices:
    thyroid: mSonics MU1
    carotid_artery: SSUN 100
    abdomen: SSUN 100
    breast: mSonics MU1
  high_quality_devices:
    thyroid: Toshiba Aplio 500
    carotid_artery: Toshiba Aplio 500
    abdomen: Toshiba Aplio 500
    breast: Aixplorer ultrasound system (SuperSonic Imagine S.A.)
  acquisition_staff: An experienced sonographer assisted by another sonographer
  pairing_procedure:
    - Volunteers held their breath for about 10 seconds during scans with the different devices
    - Experienced experts manually marked landmarks at the scanning positions
    - B-spline-based and landmark-based nonrigid registration were used to reduce deformation between low- and high-quality training images
  residual_error: The proposal identifies slight deformation from probe movement as the principal remaining error source

annotations:
  enhancement_reference:
    available_for_public_training: true
    type: Registered high-quality ultrasound image with the same filename as its low-quality input
  enhancement_reference_available_for_public_test: false
  disease_labels: false
  segmentation_masks: false
  patient_metadata: false

tasks:
  - Low-to-high ultrasound image reconstruction
  - Ultrasound image-quality enhancement

splits:
  official_design: 70% training and 30% testing, stratified by target anatomy
  public_training: 1050 paired cases
  current_public_test: 364 low-quality inputs
  patient_disjointness: Suggested by the proposal's separate training/test participant counts but not independently verifiable because patient IDs are absent

access:
  level: open download
  registration_required: false
  download_hosts:
    - Google Drive
    - Baidu Netdisk
  data_usage_license: CC BY-SA
  license_version: Not specified in the challenge proposal
  archive_license_file: false
  proposal_record_license: CC BY-ND 4.0

challenge_document:
  title: "Ultrasound Image Enhancement challenge 2023: Structured description of the challenge design"
  authors:
    - Yi Guo
    - Shichong Zhou
    - Jun Shi
    - Yuanyuan Wang
  type: BIAS structured challenge proposal; not a peer-reviewed results paper
  associated_event: MICCAI 2023
  doi: 10.5281/zenodo.7841250
  publication_date: 2023-04-18

data:
  official_page: https://ultrasoundenhance2023.grand-challenge.org/datasets/
  acquisition_center: Fudan University Shanghai Cancer Center
  files:
    - name: train_datasets.zip
      size_bytes: 70726597
      sha256: 6fe4e0f6bb0f24ac8a6f4d822c76cc6fdc5ab62655ad17c7dcf27264753b543f
      contents: 1050 low-quality and 1050 high-quality PNGs in five organ directories
    - name: low_quality_images(1).zip
      size_bytes: 10863241
      sha256: 9bb3737613be4f011e5575346152208929ec8bda20b5c416a201558859dce76b
      contents: 364 low-quality test PNGs in one flat directory

quality_checks:
  training_low_quality_images: 1050
  training_high_quality_images: 1050
  training_filename_pairs: 1050
  training_unpaired_filenames: 0
  exact_identical_low_high_pairs: 0
  training_exact_duplicate_groups: 1
  known_training_duplicate:
    - train_datasets/liver/high_quality/0838.png
    - train_datasets/liver/high_quality/0841.png
  public_test_images: 364
  public_test_high_quality_references: 0
  all_images_are_256_x_256_8_bit_grayscale_png: true
  train_test_filename_overlap: 0
  expected_but_absent_test_ids: 86
  absent_test_anatomy: Breast

discrepancies:
  - The proposal describes 450 test pairs, but the current official test download contains only 364 low-quality images and no reference images
  - The current public test IDs complete the non-breast ranges but omit all 86 breast test IDs needed to reach 450
  - The proposal's per-organ pair counts differ from the distributions in the released training archive
  - The stated 109-patient total cannot be reconstructed from the released files because patient IDs are absent

family:
  type: primary
  parent: null

verified:
  date: 2026-09-03
  methods:
    - Read all 12 pages of the official BIAS structured challenge proposal and visually checked its data, device, pairing, and license pages
    - Read the live Grand Challenge home, dataset, and submission pages
    - Downloaded and integrity-tested both files linked from the official dataset page
    - Enumerated every PNG by organ and quality tier and compared matching filenames
    - Parsed every PNG header to verify dimensions, bit depth, and grayscale color type
    - Compared released IDs with the proposed 1050/450 split and inspected representative low/high images
  sources:
    - https://ultrasoundenhance2023.grand-challenge.org/ultrasoundenhance2023/
    - https://ultrasoundenhance2023.grand-challenge.org/datasets/
    - https://ultrasoundenhance2023.grand-challenge.org/submissionevaluation/
    - https://doi.org/10.5281/zenodo.7841250
    - https://zenodo.org/api/records/7841250

notes: The challenge design states 1,500 low/high pairs from 109 patients, but the current official downloads expose only 1,050 training pairs and 364 low-quality test inputs. The public test archive lacks all high-quality references and the 86 breast cases that would bring the proposed test set to 450; no public patient mapping allows verification of the 109-patient claim.
