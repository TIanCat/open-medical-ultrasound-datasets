notes: >-
  LEPset contains 11,500 endoscopic-ultrasound images from 420 patients.
  The labeled subset contains 3,500 images for pancreatic-cancer versus
  non-pancreatic-cancer classification, while another 8,000 images are unlabeled.
  The unlabeled portion is retained as a native pretraining resource rather than
  encoding self-supervised learning as a separate learning-paradigm task. The
  Zenodo record is a data resource rather than a dedicated peer-reviewed paper,
  so paper is set to null.
