notes: The earlier row incorrectly labeled this resource as open. It is currently gated by Kaggle sign-in and acceptance of competition rules, and the displayed license is only "Subject to Competition Rules." The 16,780 number is a file count, whereas 11,143 is the number of ultrasound images. Empty masks encode no annotated brachial plexus and must not automatically be interpreted as a clinical negative label.
