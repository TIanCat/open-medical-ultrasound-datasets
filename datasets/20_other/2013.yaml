notes: The correct dataset acronym is UBPD. The paper reports 1,055 images in its abstract and contribution summary, but its detailed methods state 1,052 and its 955-image training plus 97-image test split also totals 1,052. The entry therefore displays both values and uses 1,052 as the internally reconciled released count. Current access conditions remain unverified because the authors' site is unreachable.
