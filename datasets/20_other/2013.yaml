id: US024
name: UBPD
full_name: Ultrasonic Brachial Plexus Dataset
release_year: 2022
release_year_basis: The dataset was introduced in the 2022 MallesNet paper
name_correction: The paper consistently uses UBPD; the earlier CSV value UPBD was a transposition error

anatomy:
  primary: Brachial plexus
  surrounding_targets:
    - Artery
    - Vein
    - Muscle
  acquisition_region: From the middle of the right neck toward the shoulder

modality:
  type: 2D ultrasound frames extracted from videos
  probe: High-frequency ultrasound probe
  systems:
    - Siemens ACUSON NX3 Elite
    - Philips EPIQ5
  acquisition_depth_cm: 4
  video_duration_seconds: 8
  extraction: 10-15 frames were randomly selected from each video while ensuring that at least one target appeared in each selected frame
  raw_image_dimensions: Varied and not enumerated in the paper
  paper_preprocessing: Resized to 640 x 640 for model training

scale:
  patients: 101
  ultrasound_videos: 101
  image_count:
    abstract_and_contribution_sections: 1055
    dataset_methods_section: 1052
    experiment_split_total: 1052
    adopted_for_table: 1052
    rationale: The detailed acquisition description and 955 + 97 experiment split agree on 1,052; the paper's abstract and contribution summary state 1,055
  official_experiment_split:
    training_images: 955
    training_patients: 91
    testing_images: 97
    testing_patients: 10

annotations:
  tool: LabelMe
  annotators: Professional anesthesiologists
  type: Pixel-level masks for four anatomical object categories
  categories:
    - Nerve
    - Artery
    - Vein
    - Muscle
  masks_per_image: Corresponding masks are stated for the dataset, but the current archive could not be inspected
  inter_annotator_study: Not reported in the paper

tasks:
  - Brachial plexus nerve segmentation
  - Multi-class or multi-object segmentation of nerve and surrounding anatomy
  - Context-assisted brachial plexus localization for regional anesthesia

splits:
  training:
    patients: 91
    images: 955
  testing:
    patients: 10
    images: 97
  patient_level_split: true
  validation_split: Not separately stated

