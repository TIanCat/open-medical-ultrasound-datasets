id: US019
name: Ultrasound Elastography Dataset for Unsupervised Training
release_year: 2022
release_year_basis: The official IMPACT Laboratory WordPress page was published on 2022-04-26

anatomy:
  primary: Tissue-mimicking breast phantom
  phantom_model: CIRS Model 059
  material: Zerdine
  background_elastic_modulus_kPa: 20
  inclusions: Hard inclusions with elastic modulus at least twice that of the background
  human_subject_data_in_public_dataset: false
  caution: The associated papers evaluate separate in-vivo liver-cancer data, but the official public dataset page defines this release as phantom RF data

modality:
  type: Ultrasound radio-frequency data
  application: Freehand compression ultrasound elastography
  pairing: Two RF acquisitions are compared to estimate tissue displacement
  acquisition_system: Alpinion E-Cube R12 research ultrasound machine
  probe: L3-12H linear array
  center_frequency_MHz: 10
  sampling_frequency_MHz: 40
  paper_network_input_size: 1920 x 768
  file_format: Not stated on the official page and not verified from the multipart archive

scale:
  RF_data_pairs: 2200
  use_in_associated_2022_paper: Selected phantom pairs with maximum axial displacement greater than 3 pixels were used for training
  individual_file_count: Not verified
  test_pair_count: Not stated
  subjects: 0

annotations:
  displacement_ground_truth: false
  strain_ground_truth: false
  segmentation_masks: false
  diagnostic_labels: false
  pair_relationship: available
  phantom_properties: Dataset-level physical/acquisition description only; not a per-pixel displacement or stiffness map

tasks:
  - Ultrasound elastography displacement estimation
  - Optical-flow or deformation estimation between RF acquisitions
  - Unsupervised fine-tuning on real ultrasound RF data
  - Semi-supervised transfer from labeled computer-vision data to ultrasound RF data

splits:
  official_reusable_split_files_verified: false
  training_pairs_reported: 2200 in the associated 2022 paper
  test_design: Phantom training and test data were acquired from different parts of the same phantom to reduce leakage
  composition_shift: The MICCAI paper describes one-inclusion regions for training and two-inclusion regions for testing
  exact_public_train_validation_test_counts: Not stated

access:
  level: public-download
  registration_required: false for the tested shared-folder download response
  license: Not stated on the official dataset page
  redistribution_terms: Not stated
  download_host: Dropbox
  packaging: Multipart ZIP files; the page instructs users to extract Data_121706.zip.001 first and not extract parts separately
  current_bulk_response:
    filename: TUFFC_2022_Bi_Directional_elasto.zip
    content_length_bytes: 35783987084
    caution: This is Dropbox's generated archive for the whole shared folder, not a file-level manifest

ethics_and_acquisition:
  acquisition_site: Concordia University PERFORM Centre
  human_subjects: Not applicable to the public phantom dataset
  ethics_approval: Not applicable to the public phantom dataset
  in_vivo_paper_data_note: The separate Johns Hopkins liver-cancer evaluation data had IRB approval and patient consent, but the official dataset page does not say those patient data are included in this release

