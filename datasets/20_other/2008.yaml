notes: This is a 2022 public release of 2,200 paired RF acquisitions from a CIRS Model 059 tissue-mimicking breast phantom. The real RF pairs have unknown displacement maps, so they are suitable for unsupervised or semi-supervised displacement learning rather than supervised ground-truth regression or disease classification. Separate phantom and liver-cancer in-vivo data appear in the papers' evaluations but are not established as part of this public 2,200-pair release. No dataset license or exact split counts are stated.