notes: >-
  C-TRUS contains 827 transabdominal B-mode ultrasound images extracted from
  sequences of 13 patients and provides pixel-wise colon-wall masks. Bowel-wall
  localization and thickness/inflammation quantification can be derived from the
  masks or used as downstream analyses, but no independent localization or
  measurement ground-truth annotation is encoded here; segmentation is therefore
  the only native task.
