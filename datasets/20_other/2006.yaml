id: "2006"
name: "Regensburg Pediatric Appendicitis Dataset"
full_name: "Regensburg Pediatric Appendicitis Dataset"

release_year: 2023

anatomy:
  primary: "Pediatric abdomen"
  target:
    - "Appendix"
    - "Right lower quadrant"
    - "Intestines"
    - "Lymph nodes"
    - "Reproductive organs"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "static"
  representation:
    - "image"

scale:
  - unit: "record"
    count: 782
    note: "The released spreadsheet contains 782 patient-level tabular records."
  - unit: "image"
    count: 2097
    note: "The current public image archive contains 2,097 image files."
  - unit: "patient"
    count: 579
    note: >-
      The associated paper analyzes 579 patients with 1,709 ultrasound images
      after cohort linkage and additional exclusions; this is not interchangeable
      with the full raw release count.

annotations:
  classification:
    unit: "patient"
    label_sets:
      diagnosis:
        label_type: "binary"
        classes:
          - "Appendicitis"
          - "No appendicitis"
        note: >-
          Operated patients were histologically confirmed. Conservatively
          managed patients were labeled appendicitis according to the study's
          appendix-diameter and clinical-score criteria.
      management:
        label_type: "binary"
        classes:
          - "Surgical management"
          - "Conservative management"
        note: >-
          The paper models surgical versus conservative management. The raw
          spreadsheet contains several surgical subcategories.
      severity:
        label_type: "binary"
        classes:
          - "Complicated appendicitis"
          - "Uncomplicated or no appendicitis"
        note: >-
          Complicated disease is defined by gangrenous, perforated, or
          abscessed appendicitis.
    note: >-
      The release additionally contains patient-level clinical history,
      physical-examination findings, laboratory measurements, Alvarado and
      Pediatric Appendicitis Scores, and expert-recorded ultrasonographic
      findings. These are structured input features rather than separate
      prediction targets or pixel-wise annotations.

tasks:
  - "classification"

access:
  level: "open"
  license: "CC BY-NC 4.0"
  requirements:
    - "Non-commercial use"

paper:
  title: "Interpretable and intervenable ultrasonography-based machine learning models for pediatric appendicitis"
  venue: "Medical Image Analysis"
  doi: "10.1016/j.media.2023.103042"

data:
  repository: "Zenodo"
  url: "https://zenodo.org/records/7711412"
  doi: "10.5281/zenodo.7711412"
  version: "1.03"

acquisition:
  countries:
    - "Germany"
  institutions:
    - "Children's Hospital St Hedwig, Regensburg"
  period: "2016-01-01 to 2021-12-31"
  scanners:
    - "Toshiba Xario"
    - "Toshiba Aplio XG"
  transducers:
    - "Toshiba 6 MHz convex"
    - "Toshiba 12 MHz linear"
  frequencies:
    - "6 MHz"
    - "12 MHz"
  note: >-
    The release contains original screen-exported pediatric abdominal
    ultrasound images. The associated study is a retrospective cohort of
    pediatric inpatients with suspected appendicitis.

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-03"
  sources:
    - "https://zenodo.org/records/7711412"
    - "https://doi.org/10.5281/zenodo.7711412"
    - "https://doi.org/10.1016/j.media.2023.103042"
    - "https://arxiv.org/html/2302.14460"
    - "https://github.com/i6092467/semi-supervised-multiview-cbm"

notes: >-
  The public release and the paper represent different stages of the cohort.
  The spreadsheet contains 782 rows, 760 of which have a non-empty US_Number,
  while the image archive contains 2,097 files under 707 numeric filename
  prefixes. Only 579 prefixes link to the current spreadsheet; those matched
  prefixes contain 1,727 raw images, whereas the paper reports a 579-patient,
  1,709-image analysis subset after additional exclusions. These counts are
  therefore recorded separately rather than merged into a single misleading
  dataset size. The release contains patient-level diagnosis, management,
  severity, clinical/laboratory variables, and expert-recorded ultrasonographic
  findings, but no pixel-level masks or bounding boxes. Multiview learning,
  image-and-tabular multimodal learning, and concept-bottleneck learning are
  methodological settings of the associated work rather than additional native
  dataset tasks.
