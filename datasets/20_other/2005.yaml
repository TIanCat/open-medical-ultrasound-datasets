notes: >-
  This is a 2022 public release of 2,200 paired RF acquisitions from a
  tissue-mimicking breast phantom. Pair relationships are available, but
  ground-truth displacement maps, strain maps, segmentation masks, and
  diagnostic labels are not. Consequently, displacement estimation and
  optical-flow estimation are downstream unsupervised modeling objectives
  rather than supervised native annotations. The atlas therefore represents
  the reusable resource as pretraining and signal-analysis data. Separate
  in-vivo liver-cancer evaluation data described in associated papers are not
  established as part of this public release and are excluded. The official
  page does not state a dataset license or exact reusable train/validation/test
  counts. The current Dropbox shared-folder archive is about 35.8 GB and was
  not fully downloaded during verification, so verification is marked partial.
