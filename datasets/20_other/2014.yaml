  venue: 2024 IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS)
  pages: 5867-5872
  publication_year: 2024
  doi: 10.1109/IROS58592.2024.10801467
  preprint: arXiv:2308.03717

