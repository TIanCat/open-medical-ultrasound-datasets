  parent: null

verified:
  date: 2026-09-04
  methods:
    - Read the complete IROS paper and visually inspected the dataset-curation, annotation, generalization, and needle-guidance pages
    - Confirmed the formal proceedings citation, dates, pages, and DOI through Crossref
    - Read the current GitHub README and all three machine metadata CSV files
    - Retrieved the complete non-truncated Git tree and counted all videos, nerve masks, needle masks, coordinate files, and metadata records
    - Reconciled the paper's approximate counts with exact current repository counts without treating the separate demo as a documented 227th patient
    - Distinguished expert-seeded/vetted tracking and active-contour masks from fully manual per-frame pixel contours
  sources:
    - https://github.com/Regional-US/brachial_plexus
    - https://doi.org/10.1109/IROS58592.2024.10801467
    - https://arxiv.org/abs/2308.03717

notes: The public repository is directly downloadable but states a non-commercial data-use agreement without a standalone license. The paper and README report 227 patients/videos and approximately 41,000 annotated frames. In the current branch, the three scanner-specific datasets contain 226 videos and exactly 40,200 per-frame nerve masks; a separate demo adds one MP4 and 588 masks but is not represented in the scanner metadata. The repository also contains 1,060 needle masks versus 1,061 frames reported in the paper.
