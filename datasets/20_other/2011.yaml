    - https://doi.org/10.1016/j.compmedimag.2024.102326
    - https://pubmed.ncbi.nlm.nih.gov/38211358/

notes: This is a public 75-patient volume dataset with a fixed 55-patient training and 20-patient test split. The archive has one scan volume per patient and multiple rater-specific prostate masks. The formal paper does exist and reports 2,060 training plus 758 testing images after selecting annotated slices for model experiments.
