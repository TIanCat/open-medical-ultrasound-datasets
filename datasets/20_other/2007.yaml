id: US018
name: Regensburg Pediatric Appendicitis Dataset
release_year: 2023
release_year_basis: Zenodo version 1.01 was published on 2023-02-23; the current version 1.03 retains that publication date

anatomy:
  primary: Appendix and pediatric abdomen
  depicted_regions:
    - Right lower quadrant
    - Appendix
    - Intestines
    - Lymph nodes
    - Reproductive organs
  exclusion_in_paper: Images of unrelated organs such as liver and spleen were excluded from the study dataset

modality:
  type: Ultrasound
  imaging_mode: B-mode
  dimension: 2D still images
  views_per_subject_reported_by_paper: 1 to 15
  released_file_formats:
    BMP: 2064
    PNG: 31
    JPG: 2
  format_caution: The dataset README describes the original images as BMP, but the current archive also contains PNG and JPG files
  dimensions: Variable; 185 image-dimension pairs were observed in the archive
  acquisition_systems_reported_by_paper:
    - Toshiba Xario
    - Toshiba Aplio XG
  transducers_reported_by_paper:
    - Toshiba 6 MHz convex
    - Toshiba 12 MHz linear
  release_content: Original screen-exported ultrasound images; paper preprocessing outputs are not included as released images

scale:
  tabular_patient_records: 782
  patients_with_nonempty_US_Number_in_spreadsheet: 760
  released_image_files: 2097
  unique_numeric_image_filename_prefixes: 707
  prefixes_matching_current_spreadsheet_US_Number: 579
  images_under_matching_prefixes_before_paper_exclusions: 1727
  paper_analysis_subset:
    patients: 579
    images: 1709
  caution: The archive, spreadsheet, and paper describe different stages of the cohort and must not be represented as one interchangeable count

annotations:
  pixel_level_masks: false
  bounding_boxes: false
  image_region_labels: Not provided as a standardized annotation field; free-text anatomy terms occur in some filenames
  patient_level_targets:
    diagnosis:
      paper_definition: Appendicitis versus no appendicitis
      operated_patients: Histologically confirmed
      conservatively_managed_patients: Labelled appendicitis when appendix diameter was at least 6 mm and Alvarado or Pediatric Appendicitis Score was at least 4
    management:
      paper_definition: Surgical versus conservative management assigned by a senior pediatric surgeon
      raw_spreadsheet_values:
        - conservative
        - primary surgical
        - secondary surgical
        - simultaneous appendectomy
    severity:
      paper_definition: Complicated versus uncomplicated or no appendicitis
      complicated_criteria: Gangrenous, perforated, or abscessed appendicitis
  structured_features:
    - Clinical history and physical examination
    - Laboratory measurements
    - Alvarado and Pediatric Appendicitis Scores
    - Expert-recorded ultrasonographic findings
  label_caution: Ultrasonographic findings are tabular patient-level variables, not pixel annotations

tasks:
  - Appendicitis diagnosis prediction
  - Surgical-versus-conservative management prediction
  - Complicated appendicitis severity prediction
  - Multiview ultrasound classification
  - Image-and-tabular multimodal learning
  - Concept bottleneck learning from ultrasonographic findings

splits:
  paper_train_test_ratio: 90/10 at patient level
  paper_model_selection: Five-fold cross-validation within the training set
  released_test_set_codes:
    unique_codes: 71
    all_present_as_archive_filename_prefixes: true
    present_in_current_spreadsheet_US_Number: 57
    caution: The released code list does not map completely to the current spreadsheet and should not be treated as a directly reusable labelled split without reconciliation
  author_notebook_behavior: Uses the provided patient-code list when supplied; otherwise generates a group-level 90/10 split

access:
  level: open
  registration_required: false for tested Zenodo file URLs
  license: CC BY-NC 4.0
  commercial_use: prohibited by the stated license

ethics_and_acquisition:
  institution: Children's Hospital St Hedwig, Regensburg, Germany
  design: Retrospective cohort of pediatric inpatients with suspected appendicitis
  collection_period: 2016-01-01 to 2021-12-31
  age_range_years: 0 to 18 in the paper cohort
  ethics_approvals:
    - 18-1063-101
    - 18-1063_1-101
    - 18-1063_2-101
  anonymization: The paper describes the publicly released dataset as anonymized

paper:
  title: Interpretable and intervenable ultrasonography-based machine learning models for pediatric appendicitis
  journal: Medical Image Analysis
  volume: 91
  article_number: 103042
  publication_year: 2024
  doi: 10.1016/j.media.2023.103042
  preprint: arXiv:2302.14460
  analysis_subset:
    patients: 579
    ultrasound_images: 1709

data:
  repository: Zenodo
  landing_page: https://zenodo.org/records/7711412
  doi: 10.5281/zenodo.7711412
  concept_doi: 10.5281/zenodo.7669214
  version: 1.03
  files:
    - README.md
    - app_data.xlsx
    - US_Pictures.zip
    - test_set_codes.csv
    - multiple_in_one
    - multiple_in_one_
  code_repository: https://github.com/i6092467/semi-supervised-multiview-cbm

quality_checks:
  official_image_archive:
    archive_size_bytes: 523034730
    expected_md5: 38b81fd3dddaeed458132be2ec1732ed
    observed_md5: 38b81fd3dddaeed458132be2ec1732ed
    zip_integrity_test: passed
    image_files: 2097
    unique_filenames: 2097
    unique_SHA256_contents: 2097
    recognized_image_signatures: 2097
    image_dimension_variants: 185
  spreadsheet:
    worksheet_patient_rows: 782
    nonempty_US_Number_values: 760
    unique_nonempty_US_Number_values: 760
  archive_spreadsheet_linkage:
    image_prefixes: 707
    matched_prefixes: 579
    archive_only_prefixes: 128
    spreadsheet_only_US_Number_values: 181
    images_under_matched_prefixes: 1727
  paper_difference:
    reported_patients: 579
    reported_images: 1709
    image_difference_from_matched_raw_release: 18
    likely_basis: The author preprocessing notebook accepts an image blacklist, but the current Zenodo record does not include that blacklist
    caution: This is a file-to-paper inference; the identities of the 18 excluded images were not established
  sample_visual_review:
    filename: 1.4 Appendix.png
    dimensions: 683 x 516
    observation: Screen-exported grayscale B-mode content stored as RGB with scanner overlays; no pixel mask was present

family:
  type: primary
  parent: null

verified:
  date: 2026-09-03
  methods:
    - Read the current Zenodo metadata, dataset README, and all small released metadata files
    - Parsed every patient row and relevant target column in app_data.xlsx
    - Downloaded the complete official image archive and matched its MD5 checksum
    - Passed a full ZIP integrity test and enumerated every image, filename prefix, format signature, dimension, and SHA-256 digest
    - Reconciled archive filename prefixes against spreadsheet US_Number values and the released test-code list
    - Read the complete Medical Image Analysis paper in HTML form and compared its cohort and image counts with the release
    - Inspected the author preprocessing notebook and dataset loader for split and blacklist behavior
    - Visually inspected one released appendix image
  sources:
    - https://zenodo.org/records/7711412
    - https://doi.org/10.5281/zenodo.7711412
    - https://doi.org/10.1016/j.media.2023.103042
    - https://arxiv.org/html/2302.14460
    - https://github.com/i6092467/semi-supervised-multiview-cbm

notes: The public release has 782 tabular records and 2,097 image files under 707 numeric prefixes, whereas only 579 prefixes link to the current spreadsheet. Those linked prefixes contain 1,727 raw images; the paper reports using 1,709 images from the same 579-patient count after additional exclusions. These stages must remain explicit. The release contains patient-level targets and structured ultrasonographic findings but no pixel-level masks.