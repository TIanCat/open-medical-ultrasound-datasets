notes: >-
  This resource is not currently represented elsewhere in the atlas and is
  suitable for inclusion as a primary medical-ultrasound dataset. The public
  Kaggle version contains 202 skin-lesion instances, each intended to include
  paired B-mode and Color Doppler images plus a binary benign/malignant label,
  a specific diagnosis field (Dx), and transducer-frequency metadata.

  The associated 2022 paper describes a larger institutional study cohort:
  235 histologically confirmed skin-lesion images were used for model
  development and an additional 35 images for external testing. These paper
  counts should not be substituted for the 202-instance public Kaggle release.

  A 2026 study that re-used the Kaggle resource reported several data-quality
  issues: B-mode/Doppler filenames were inverted for records 57, 59, and 90;
  filename-format corrections were needed for several other records; and
  records 6, 62, 74, and 121 contained two Doppler images instead of a proper
  B-mode/Doppler pair. These issues do not invalidate the dataset but should be
  considered during preprocessing.

  A 2025 review of publicly disseminated ultrasound resources independently
  lists this dataset as an open-access skin-ultrasound dataset with 202 cases.
  No dataset-specific reusable license could be independently confirmed from
  the currently retrievable Kaggle metadata, so access.license is left null.
