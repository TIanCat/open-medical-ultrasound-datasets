notes: >-
  BITE contains data from 14 brain-tumor patients organized into four
  downloadable groups: pre-/post-resection ultrasound, preoperative MRI
  with pre-resection ultrasound, pre-/post-operative MRI, and preoperative
  MRI with post-resection ultrasound. Ultrasound data include original 2D
  B-mode sweeps and reconstructed 3D volumes. Expert-selected homologous
  landmarks are stored in .tag files for registration evaluation; tumor
  segmentation masks are not provided. Images primarily use MINC format.
  The official site does not state an explicit dataset license. The Group 2
  file endpoint was verified using a partial-content request.
