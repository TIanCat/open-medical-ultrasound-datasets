notes: "Roboflow v1 contains 1,080 images, all assigned to the training set, with no preprocessing or augmentation. The project is configured for instance segmentation with four classes: Kidney, Liver, Normal-Kidney, and Spleen. It provides no description of the patient count, acquisition institution, equipment, selection criteria, or source provenance. Roboflow marks the dataset as downloadable under CC BY 4.0, and an independent 2025 review records it as open access. During verification, the page metadata was available through search indexing, but direct command-line archive access was blocked by Cloudflare; the image archive was therefore not downloaded."
