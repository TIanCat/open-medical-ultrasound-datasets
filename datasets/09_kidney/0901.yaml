notes: "Contains 514 unique anonymized B-mode PNG images from 514 distinct patients and 20 additional duplicate copies used to assess annotation consistency, giving 534 delivered image files. The images include native and transplanted kidneys. Two expert sonographers independently supplied fine-grained polygon annotations for the renal capsule, cortex, medulla, and central echogenic complex. Image-quality, view-type (transverse, longitudinal, or other), and kidney-type labels are also included. The public GitHub repository contains code and annotation resources, but the source ultrasound images require registration and manual approval before they are released through UBC OneDrive. The registration form returned HTTP 200 during verification. Data and code are licensed under CC BY-NC-SA and may not be used commercially."
