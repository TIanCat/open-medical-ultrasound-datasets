verified:
  date: 2026-09-03

notes: >-
  The dataset was published on Zenodo on 2025-11-20, while the associated
  Scientific Data paper was published in 2026. It contains 774 videos and
  68,106 frames from three institutions and three ultrasound devices.
  Patient count is not reported. Segmentation masks are PNG files, and
  landmark.json files provide pubic-symphysis and fetal-head coordinates
  used to calculate AoP and HSD. The current DatasetV3.zip file is
  1,084,176,447 bytes and its endpoint was verified using a partial-content
  request. The paper title contains the publisher's spelling "Ultrasouno".
