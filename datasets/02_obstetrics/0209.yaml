id: "0209"
name: "FOCUS"
full_name: "FOCUS: Four-chamber Ultrasound Image Dataset for Fetal Cardiac Biometric Measurement"
aliases: []

release_year: 2025

anatomy:
  primary: "Fetus"
  target:
    - "Fetal heart"
    - "Fetal thorax"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "static"
  representation:
    - "image"

scale:
  - unit: "patient"
    count: 217
  - unit: "image"
    count: 300

annotations:
  segmentation:
    unit: "image"
    type: "binary"
    targets:
      - "Fetal heart"
      - "Fetal thorax"
    format: "mask"
    count: 300
    annotators:
      - "Expert sonographer"
    note: "Separate cardiac and thoracic region annotations are provided for every image."

  detection:
    unit: "image"
    targets:
      - "Fetal heart"
      - "Fetal thorax"
    format: "rotated_bounding_box"
    annotation_format: "DOTA"

  measurements:
    unit: "image"
    targets:
      - "Cardiothoracic diameter ratio"
    format: "ellipse_parameters"
    note: "Ellipse annotations for cardiac and thoracic regions support biometric measurement."

tasks:
  - "segmentation"
  - "detection"
  - "measurement"

splits:
  unit: "image"
  training:
    count: 250
  test:
    count: 50

access:
  level: "open"
  license: "CC BY 4.0"
  requirements: []

paper: null

data:
  repository: "Zenodo"
  url: "https://zenodo.org/records/14597550"
  doi: "10.5281/zenodo.14597550"
  version: "1.0"

acquisition:
  countries: null
  institutions: null
  period: null
  scanners: null
  transducers: null
  frequencies: null
  note: "FOCUS reuses four-chamber images selected from FETAL_PLANES_DB rather than constituting a new clinical acquisition."

family:
  type: "derived"
  parent: "0202"
  related: []

verification:
  status: "verified"
  date: "2026-09-04"
  sources:
    - "https://zenodo.org/records/14597550"
    - "https://github.com/szuboy/FOCUS-dataset"

notes: >-
  FOCUS was constructed from the public FETAL_PLANES_DB resource and adds
  fetal-heart and thoracic ellipse annotations, DOTA-format rotated boxes,
  segmentation masks, and biometric information. It is therefore classified
  as a derived dataset with parent 0202 rather than as an independent primary
  acquisition family. No dedicated peer-reviewed dataset paper was identified.
