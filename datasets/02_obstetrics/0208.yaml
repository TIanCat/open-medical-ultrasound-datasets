notes: >-
  The dataset contains 1,358 transperineal ultrasound images from 1,124
  pregnant participants at two medical institutions. Images and labels are
  paired .mha files. Label values 0, 1, and 2 represent background, pubic
  symphysis, and fetal head. Each image was annotated by two annotators and
  reviewed by a physician. The 132 MB Zenodo file endpoint was verified
  using a partial-content request.
