notes: >-
  PSFHS provides image/ground-truth-mask pairs only. The Scientific Data paper
  demonstrates that angle of progression (AoP) can be calculated from the final
  PS/FH segmentation masks and reports an average AoP of 98.33° ± 21.11°, but the
  public Zenodo archive contains the images and segmentation labels rather than a
  separate AoP ground-truth table. AoP measurement is therefore treated as a
  derived use rather than a native dataset task.
