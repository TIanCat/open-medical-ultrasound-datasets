notes: "Contains 450 routinely acquired maternal-fetal ultrasound images from centres in Malawi, Egypt, Uganda, Ghana, and Algeria. The country-level table reports 25 participant records per country, totalling 125, although the paper narrative also describes the cohort as approximately 120 patients. Malawi, Egypt, and Algeria each provide 100 images; Uganda and Ghana each provide 75 and contain no thorax images. The archive includes plane labels, patient identifiers, country information, and the experimental splits. The complete 42,845,356-byte Zenodo archive was successfully transferred during verification and returned HTTP 200, but it was discarded rather than retained."
