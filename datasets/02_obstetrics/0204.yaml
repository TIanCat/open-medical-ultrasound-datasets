id: "0204"
name: "African Fetal Standard Plane Dataset"
full_name: "Maternal Fetal Ultrasound Planes from Low-Resource Imaging Settings in Five African Countries"
aliases: []

release_year: 2023

anatomy:
  primary: "Fetus"
  target:
    - "Fetal abdomen"
    - "Fetal brain"
    - "Fetal femur"
    - "Fetal thorax"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "static"
  representation:
    - "image"

scale:
  - unit: "patient"
    count: 125
    note: "The Methods section states 25 patients per country across five countries; the paper overview also refers to approximately 120 patients."
  - unit: "image"
    count: 450

annotations:
  classification:
    unit: "image"
    num_classes: 4
    classes:
      - "Fetal abdomen"
      - "Fetal brain"
      - "Fetal femur"
      - "Fetal thorax"
    note: "Uganda and Ghana contain no thorax images."

tasks:
  - "standard_plane_classification"

access:
  level: "open"
  license: null
  requirements: []

paper:
  title: "Generalisability of fetal ultrasound deep learning models to low-resource imaging settings in five African countries"
  venue: "Scientific Reports"
  doi: "10.1038/s41598-023-29490-3"

data:
  repository: "Zenodo"
  url: "https://zenodo.org/records/7540448"
  doi: "10.5281/zenodo.7540448"
  version: "v1.0"

acquisition:
  countries:
    - "Malawi"
    - "Egypt"
    - "Uganda"
    - "Ghana"
    - "Algeria"
  institutions:
    - "Queen Elizabeth Central Hospital, Malawi"
    - "Sayedaty Centre, Egypt"
    - "Mulago National Referral Hospital, Uganda"
    - "KBTH Polyclinic Centre, Accra, Ghana"
    - "EPH Kouba and Clinique Des Lilas, Algeria"
  period: "November 2021 to February 2022"
  scanners:
    - "Mindray DC-N2"
    - "GE Voluson P8"
    - "Siemens ultrasound system"
    - "EDAN DUS 60"
    - "GE ultrasound system"
  transducers:
    - "Curved transducer"
  frequencies:
    - "3-7.5 MHz"

family:
  type: "primary"
  parent: null
  related:
    - "FETAL_PLANES_DB"

verification:
  status: "verified"
  date: "2026-09-04"
  sources:
    - "https://doi.org/10.1038/s41598-023-29490-3"
    - "https://zenodo.org/records/7540448"

notes: >-
  This resource contains independently acquired fetal standard-plane images from five
  African clinical centres and is therefore treated as a primary multi-centre acquisition.
  The associated study evaluates cross-country generalisation and transfer learning using
  FETAL_PLANES_DB as a high-resource source domain, but domain adaptation is not encoded
  as a native dataset task because the direct supervision consists of fetal-plane labels.
  The public Zenodo metadata currently does not expose a clear dataset-specific license,
  so license is left null rather than inferred from the article license.
