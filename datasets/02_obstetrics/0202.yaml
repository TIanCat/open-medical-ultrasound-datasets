id: "0202"
name: "FETAL_PLANES_DB"
full_name: "FETAL_PLANES_DB: Common Maternal-Fetal Ultrasound Images"
aliases: []

release_year: 2020

anatomy:
  primary: "Fetus and maternal cervix"
  target:
    - "Fetal abdomen"
    - "Fetal brain"
    - "Fetal femur"
    - "Fetal thorax"
    - "Maternal cervix"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "static"
  representation:
    - "image"

scale:
  - unit: "patient"
    count: 1792
  - unit: "study"
    count: 2087
  - unit: "image"
    count: 12400

annotations:
  classification:
    unit: "image"
    num_classes: 6
    classes:
      - "Fetal abdomen"
      - "Fetal brain"
      - "Fetal femur"
      - "Fetal thorax"
      - "Maternal cervix"
      - "Other"
    distribution:
      Fetal abdomen: 711
      Fetal brain: 3092
      Fetal femur: 1040
      Fetal thorax: 1718
      Maternal cervix: 1626
      Other: 4213
    subgroups:
      Fetal brain:
        num_classes: 3
        classes:
          - "Trans-thalamic"
          - "Trans-cerebellar"
          - "Trans-ventricular"
        distribution:
          Trans-thalamic: 1638
          Trans-cerebellar: 714
          Trans-ventricular: 597
        note: "The three fine-grained labels cover most, but not all, fetal-brain images."

tasks:
  - "standard_plane_classification"

access:
  level: "open"
  license: "CC BY 4.0"
  requirements: []

paper:
  title: "Evaluation of deep convolutional neural networks for automatic classification of common maternal fetal ultrasound planes"
  venue: "Scientific Reports"
  doi: "10.1038/s41598-020-67076-5"

data:
  repository: "Zenodo"
  url: "https://zenodo.org/records/3904280"
  doi: "10.5281/zenodo.3904280"
  version: "1.0"

acquisition:
  countries:
    - "Spain"
  institutions:
    - "Hospital Clínic, Barcelona"
    - "Hospital Sant Joan de Déu, Barcelona"
  period: "October 2018 to April 2019"
  scanners:
    - "GE Voluson E6"
    - "GE Voluson S8"
    - "GE Voluson S10"
    - "Aloka"
  transducers:
    - "Curved abdominal transducer"
    - "Vaginal probe for cervical screening"
  frequencies:
    - "3-7.5 MHz"
    - "2-10 MHz"

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-04"
  sources:
    - "https://doi.org/10.1038/s41598-020-67076-5"
    - "https://zenodo.org/records/3904280"

notes: >-
  The dataset contains 12,400 routinely acquired maternal-fetal ultrasound images
  from 1,792 patients and 2,087 studies. Six top-level labels are provided, together
  with three fine-grained fetal-brain plane labels. Patient ID, ultrasound-machine ID,
  operator ID, and the patient-level train/test split used in the paper are included.
