notes: "Contains 12,400 images from 1,792 pregnant women attending second- and third-trimester routine screening at two hospitals in Barcelona. An expert maternal-fetal clinician assigned six main plane labels: fetal abdomen, fetal brain, fetal femur, fetal thorax, maternal cervix, and other. Brain images additionally have trans-thalamic, trans-cerebellar, and trans-ventricular subplane labels. Patient identifiers, ultrasound machine, operator, and the paper's patient-level training/test split are included. The 2,088,522,169-byte Zenodo archive is openly available under CC BY 4.0; a 1,024-byte range request returned HTTP 206 during verification, but the full archive was not downloaded."
