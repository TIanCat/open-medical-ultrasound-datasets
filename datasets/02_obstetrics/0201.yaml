  measurements:
    unit: "image"
    targets:
      - "Head circumference"
    format: "tabular_metadata"
    count: 999
    unit_of_measurement: "mm"
    note: "Ground-truth HC is publicly released for the training set; test-set HC ground truth is withheld."

tasks:
