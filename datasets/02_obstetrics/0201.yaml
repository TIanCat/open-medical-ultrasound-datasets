id: "0201"
name: "HC18"
full_name: "Head Circumference 2018 Challenge Dataset"
aliases:
  - "Fetal Head Circumference Dataset"

release_year: 2018

anatomy:
  primary: "Fetus"
  target:
    - "Fetal head"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "static"
  representation:
    - "image"

scale:
  - unit: "patient"
    count: 551
  - unit: "image"
    count: 1334

annotations:
  segmentation:
    unit: "image"
    type: "contour"
    targets:
      - "Fetal head"
    format: "ellipse_outline"
    count: 999
