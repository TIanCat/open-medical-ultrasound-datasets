    - "https://doi.org/10.1371/journal.pone.0200412"
    - "https://zenodo.org/records/1327317"
    - "https://hc18.grand-challenge.org/"

notes: >-
  HC18 contains 1,334 fetal-head standard-plane images from 551 pregnant women.
  The 999-image training set includes expert-fitted ellipse outlines, pixel spacing,
  and head-circumference measurements in millimetres. The 335-image test set includes
  images and pixel spacing, while ellipse and HC ground truth are retained by the
  challenge organizers. The stable Zenodo concept DOI is 10.5281/zenodo.1322000;
  this record uses the current v2 DOI 10.5281/zenodo.1327317.
