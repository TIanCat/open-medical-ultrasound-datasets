notes: "A non-human dataset of 15,728 ultrasound images acquired from a 23-week fetal phantom. Four orientation labels (hdvb, hdvf, huvb, and huvf) cover all images. Diagnostic-plane labels cover 5,265 images and comprise AC, BPD, FL, and No Plane. Anatomy labels for head, arms, legs, and abdomen cover 9,317 images. Bounding-box annotations for the same structures occur in 9,455 images and may contain multiple boxes per image. The repository provides XML annotations, source code, trained models, and an MIT license. Original images are linked through Google Drive; during verification, the link resolved but the direct request returned a 2,435-byte HTML interstitial rather than image data, so the complete source-image archive was not downloaded."
