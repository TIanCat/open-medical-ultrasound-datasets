notes: >-
  FPUS23 is a non-human fetal-phantom dataset. Diagnostic-plane labels cover 5,265
  images, fetal-orientation labels cover all 15,728 images, fetal-anatomy labels cover
  9,317 images, and bounding-box annotations cover 9,455 images. The GitHub repository
  itself carries an MIT license, while the linked source-image archive is hosted
  separately on Google Drive; because the image-archive license is not stated
  independently on the data page, access.license is left null.
