notes: "Contains 6,224 frames extracted from 78 intrapartum transperineal ultrasound videos acquired from 51 pregnant women. Each video folder provides grayscale image frames, masks, enhanced mask previews, and a frame-label CSV. Masks encode the pubic symphysis as pixel value 7 and the fetal head as pixel value 8. Frame labels are None, OnlySP, OnlyHead, and SP+Head. The images were cropped and overwritten to remove interface toolbars and text, converted to grayscale, and retained at 1295x1026 pixels without downsampling. Figshare v2 is public under CC BY 4.0. During verification, readme.txt was downloaded in full and a 1,024-byte range request to us_data.zip returned HTTP 206; the complete archive was not downloaded."
