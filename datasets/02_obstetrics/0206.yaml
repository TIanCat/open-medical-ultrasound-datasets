notes: >-
  The official Mendeley description states nearly 1,500 images, while later
  public studies report 1,588 images from 169 term pregnancies. Images were
  converted from DICOM to PNG, and annotations were exported from 3D Slicer
  as .npy dictionaries. The dataset page was verified, but the actual data
  archive was not downloaded during this verification.
