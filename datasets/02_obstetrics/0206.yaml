id: "0206"
name: "Fetal Abdominal Structures Segmentation Dataset"
full_name: "Fetal Abdominal Structures Segmentation Dataset Using Ultrasonic Images"
aliases: []

release_year: 2023

anatomy:
  primary: "Fetus"
  target:
    - "Fetal abdominal aorta"
    - "Intrahepatic umbilical vein"
    - "Fetal stomach"
    - "Fetal liver"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "static"
  representation:
    - "image"

scale:
  - unit: "patient"
    count: 169
  - unit: "image"
    count: 1588
    note: "The Mendeley description states nearly 1,500 images; 1,588 is the count reported by later dataset inventories and public reuse studies."

annotations:
  segmentation:
    unit: "image"
    type: "multiclass"
    targets:
      - "Fetal abdominal aorta"
      - "Intrahepatic umbilical vein"
      - "Fetal stomach"
      - "Fetal liver"
    format: "NPY"
    annotators:
      - "Expert clinicians"
    note: "Annotations were created in 3D Slicer and exported as NumPy dictionaries."

tasks:
  - "segmentation"

access:
  level: "open"
  license: "CC BY 4.0"
  requirements: []

paper: null

data:
  repository: "Mendeley Data"
  url: "https://data.mendeley.com/datasets/4gcpm9dsc3/1"
  doi: "10.17632/4gcpm9dsc3.1"
  version: "1"

acquisition:
  countries:
    - "Brazil"
  institutions:
    - "Maternity of University Hospital Polydoro Ernani de São Thiago, Universidade Federal de Santa Catarina"
  period: "September 2021 to September 2023"
  scanners:
    - "Siemens Acuson"
    - "GE Voluson 730"
    - "Philips EPIQ Elite"
  transducers:
    - "Curved linear transducer"
  frequencies:
    - "2-9 MHz"

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-04"
  sources:
    - "https://data.mendeley.com/datasets/4gcpm9dsc3/1"
    - "https://doi.org/10.17632/4gcpm9dsc3.1"

notes: >-
  The official Mendeley record describes a cohort of 169 term pregnancies and
  nearly 1,500 fetal abdominal-circumference images. Public reuse studies report
  1,588 released images. Images were originally stored in DICOM, converted to PNG,
  and annotated in 3D Slicer. The dataset does not define a native classification
  task or a dedicated peer-reviewed dataset paper.
