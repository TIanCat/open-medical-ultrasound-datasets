id: US005
name: Dataset of Breast Ultrasound Images
aliases:
  - BUSI
  - Dataset_BUSI_with_GT
release_year: 2020
release_year_basis: Data in Brief collection year; the article was published online on 2019-11-21

anatomy:
  primary: Breast
  target: Breast tissue and breast lesions

modality:
  type: B-mode ultrasound
  dimension: 2D
  temporal: static
  source_format: DICOM
  released_format: PNG
  color: Released ultrasound images are 8-bit RGB PNG files containing grayscale content
  original_scanner_output_resolution: 1280 x 1024 pixels
  released_resolution:
    description: Cropped to varying sizes; the paper reports an average of approximately 500 x 500 pixels
    verified_width_range_pixels: 190-1048
    verified_height_range_pixels: 310-719

scale:
  patients: 600
  patient_sex: Female
  patient_age_range_years: 25-75
  images: 780
  initial_images_before_preprocessing: 1100
  class_distribution:
    benign: 437
    malignant: 210
    normal: 133
  mask_files: 798
  images_with_a_base_mask: 780
  additional_masks_for_multi-lesion_images: 18

annotations:
  classification:
    available: true
    unit: image
    source: Class folder and filename
    classes:
      - Normal
      - Benign
      - Malignant
  segmentation:
    available: true
    unit: image
    target: Breast lesion
    method: Freehand segmentation in MATLAB
    review: Radiologists at Baheya Hospital reviewed and corrected annotations; their number and agreement procedure are not reported
    pairing: Every image has a same-stem base mask; 18 images have one additional mask file
    normal_images: Corresponding masks contain no tumor regions
  bounding_boxes:
    available: false
    note: Detection or localization targets can be derived from the segmentation masks

tasks:
  - Three-class image classification (normal, benign, malignant)
  - Breast lesion segmentation
  - Breast lesion detection or localization derived from masks

access:
  level: open
  registration_required: false for the verified mirror
  canonical_page_status: Returned HTTP 403 during verification on 2026-09-03
  canonical_zip_status: Returned HTTP 403 during verification on 2026-09-03
  verified_mirror_status: Accessible without registration on 2026-09-03
  dataset_license: Not explicitly stated on the original dataset page or in the archive
  paper_license: CC BY 4.0
  license_note: The article license must not be assumed to license the separately distributed dataset

paper:
  title: Dataset of breast ultrasound images
  authors:
    - Walid Al-Dhabyani
    - Mohammed Gomaa
    - Hussien Khaled
    - Aly Fahmy
  venue: Data in Brief
  publication_year: 2020
  online_publication_date: 2019-11-21
  volume: 28
  article_number: 104863
  doi: 10.1016/j.dib.2019.104863
  pmid: 31867417
  pmcid: PMC6906728

data:
  canonical_page: https://scholar.cu.edu.eg/?q=afahmy/pages/dataset
  canonical_zip: https://scholar.cu.edu.eg/Dataset_BUSI.zip
  verified_mirror:
    provider: MathWorks
    url: https://ssd.mathworks.com/supportfiles/image/data/Dataset_BUSI.zip
    archive_size_bytes: 205873341
    archive_md5: b868f439741ba24c260c59571de79eca
  archive_root: Dataset_BUSI_with_GT
  folders:
    - benign
    - malignant
    - normal
  files:
    ultrasound_images: 780
    masks: 798
    total_png_files: 1578

acquisition:
  institution: Baheya Hospital for Early Detection & Treatment of Women's Cancer
  location: Cairo, Egypt
  collection_year: 2018
  scanners:
    - LOGIQ E9
    - LOGIQ E9 Agile
  transducer: ML6-15-D Matrix linear probe
  frequency: 1-5 MHz, as reported by the paper

quality_audit:
  paper_count_discrepancy: The paper's table lists 487 benign images, but 487 + 210 + 133 is inconsistent with its stated total of 780; the released archive contains 437 benign images
  follow_up_article:
    title: "Letter to the Editor. Re: Dataset of breast ultrasound images"
    doi: 10.1016/j.dib.2023.109247
    pmid: 37383756
    pmcid: PMC10293973
    findings:
      duplicate_images: 155
      suspected_axilla_or_non-breast_images: 70
      images_with_questionable_class_assignment_at_least: 19
      cases_remaining_without_annotations_after_the_audit_filters: 399
    supplementary_data: https://data.mendeley.com/datasets/k8t3gnx9h6/1
  official_split: Not provided
  patient_to_image_mapping: Not provided in the released archive; patient-disjoint splitting cannot be reconstructed from filenames alone

family:
  type: primary
  parent: null

verified:
  date: 2026-09-03
  methods:
    - Read the original Data in Brief article and its full-text XML
    - Downloaded and tested the MathWorks-hosted archive
    - Counted all original images and masks by class and checked every PNG header
    - Confirmed that each image has a same-dimension base mask and identified 18 additional masks
    - Read the 2023 peer-reviewed follow-up quality audit and checked its supplementary-data record
  sources:
    - https://doi.org/10.1016/j.dib.2019.104863
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC6906728/
    - https://scholar.cu.edu.eg/?q=afahmy/pages/dataset
    - https://uk.mathworks.com/help/medical-imaging/ug/classify-breast-tumors-from-ultrasound-images-using-radiomics-features.html
    - https://doi.org/10.1016/j.dib.2023.109247
    - https://data.mendeley.com/datasets/k8t3gnx9h6/1

notes: The Mendeley record previously linked as the dataset is only supplementary material for the 2023 quality-audit letter, not the original BUSI download. The original dataset page and ZIP were inaccessible during verification, so the working MathWorks mirror is listed for download. No explicit dataset license or official train/validation/test split was found.
