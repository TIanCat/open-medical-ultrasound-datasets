id: US009
name: BUSI_WHU
full_name: "BUSI_WHU: Breast Cancer Ultrasound Image Dataset"
release_year: 2023
release_year_basis: Mendeley Data version 1 was published on 2023-10-11; the current version 3 was published on 2025-07-23

anatomy:
  primary: Breast
  target: Breast tumor

modality:
  type: B-mode ultrasound
  dimension: 2D
  temporal: static
  released_image_format: 8-bit BMP
  released_mask_format: 8-bit BMP
  released_resolution:
    width_range_pixels: 243-2400
    height_range_pixels: 233-1947
    distinct_width_height_pairs: 676

scale:
  patients: 816
  images: 927
  masks: 927
  image_class_distribution:
    benign: 560
    malignant: 367
  patient_class_distribution:
    benign: 560
    malignant: 256
  images_per_patient:
    minimum: 1
    maximum: 9
    distribution:
      one_image: 778
      two_images: 15
      three_images: 4
      four_images: 6
      five_images: 5
      six_images: 2
      seven_images: 3
      eight_images: 2
      nine_images: 1
  stated_age_range_years: 17-79
  sex_distribution: Not provided

annotations:
  diagnosis:
    available: true
    unit: image, consistent within each patient ID
    classes:
      - Benign
      - Malignant
    reference_standard: Not stated on the data page or in the released files
  segmentation:
    available: true
    unit: image
    target: Tumor region
    type: Binary mask with values 0 and 255
    pairing: Every image has a same-size mask
    annotator_and_method: Not stated on the data page or in the released files
  measurements:
    available: true
    source: Patient_infos_BUSI-WHU.xlsx
    fields:
      - pixel scale
      - tumor area in pixels and square centimeters
      - image area
      - tumor-to-image area ratio
      - tumor centroid
      - maximum and minimum tumor diameter in pixels

tasks:
  - Breast tumor segmentation
  - Benign versus malignant classification
  - Tumor localization derived from masks
  - Tumor size and morphology measurement derived from masks and metadata

splits:
  official_train_validation_test_split: Not provided
  patient_grouping_available: true

access:
  level: open
  registration_required: false
  license: CC BY 4.0

paper:
  dedicated_peer_reviewed_dataset_paper: false
  resource_type: Mendeley Data dataset

data:
  repository: Mendeley Data
  landing_page: https://data.mendeley.com/datasets/k6cpmwybk3/3
  original_version:
    version: 1
    publication_date: 2023-10-11
    doi: 10.17632/k6cpmwybk3.1
  current_version:
    version: 3
    publication_date: 2025-07-23
    doi: 10.17632/k6cpmwybk3.3
  acquisition_period: December 2020 to December 2022
  acquisition_institution: Department of Radiology, Renmin Hospital of Wuhan University
  ethics_approval: WDRY2022-K217
  files:
    - name: BUSI-WHU.zip
      size_bytes: 128106790
      sha256: 5d10c0bb931666e9cff48db9161febc0ec0c74e4b611c2edcbb9726f6d9d74cc
    - name: Patient_infos_BUSI-WHU.xlsx
