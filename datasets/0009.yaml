  archive_contents:
    images_directory: img
    masks_directory: gt
    images: 927
    masks: 927

quality_checks:
  complete_image_mask_pairs: 927
  image_mask_dimension_mismatches: 0
  empty_masks: 0
  masks_with_values_other_than_0_and_255: 0
  metadata_rows: 927
  unique_patient_ids: 816
  patient_label_conflicts: 0
  image_area_metadata_mismatches: 0
  tumor_area_metadata_mismatches: 0
  exact_duplicate_file_groups:
    images: 0
    masks: 0

family:
  type: primary
  parent: null

verified:
  date: 2026-09-03
  methods:
    - Read the official Mendeley Data metadata and version history
    - Downloaded both version 3 files and verified their SHA-256 hashes
    - Integrity-tested the ZIP and enumerated every image and mask
    - Parsed all 927 spreadsheet records and grouped them by patient ID
    - Decoded every BMP header and mask payload to verify dimensions, binary values, nonempty masks, and metadata area counts
  sources:
    - https://data.mendeley.com/datasets/k6cpmwybk3/3
    - https://data.mendeley.com/public-api/datasets/k6cpmwybk3/snapshot/3
    - https://doi.org/10.17632/k6cpmwybk3.1
    - https://doi.org/10.17632/k6cpmwybk3.3

notes: The data page states 927 images but not the number of patients. Version 3's patient_index field identifies 816 patients; the 560/367 class counts are image-level, while patient-level counts are 560/256. The release does not document the annotation procedure or provide an official train/test split.
