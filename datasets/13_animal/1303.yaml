id: "1303"
name: "Mouse Brain Tumor Ultrasound"
full_name: "High-Resolution Ultrasound Data for AI-Based Segmentation in Mouse Brain Tumor"

release_year: 2025

anatomy:
  primary: "Mouse brain"
  target:
    - "Brain tumor"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "mixed"
  representation:
    - "image"
    - "video"

scale:
  - unit: "image"
    count: 1856
    note: "The resource contains 1,448 tumor images and 408 no-tumor images."

annotations:
  segmentation:
    unit: "image"
    type: "binary"
    targets:
      - "Brain tumor"
    format: "mask"
    annotators:
      - "Multiple annotators with expert refinement"
    note: >-
      Pixel-wise tumor masks were produced by multiple annotators and refined
      by experts. Tumor/no-tumor image status can be derived from the tumor
      annotations, but no independent classification label set is required.

tasks:
  - "segmentation"

access:
  level: "open"
  license: "CC BY 4.0"
  requirements: []

paper:
  title: "High-Resolution Ultrasound Data for AI-Based Segmentation in Mouse Brain Tumor"
  venue: "Scientific Data"
  doi: "10.1038/s41597-025-05619-z"

data:
  repository: "Figshare"
  url: "https://doi.org/10.6084/m9.figshare.27237894"
  doi: "10.6084/m9.figshare.27237894"
  version: null

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-03"
  sources:
    - "https://doi.org/10.6084/m9.figshare.27237894"
    - "https://doi.org/10.1038/s41597-025-05619-z"

notes: >-
  The dataset contains 1,856 high-resolution mouse-brain ultrasound images,
  including 1,448 tumor images and 408 no-tumor images. Its native supervision
  is pixel-wise brain-tumor segmentation. Binary tumor/no-tumor classification
  is directly derivable from the segmentation annotations and is therefore not
  duplicated as a separate native task.
