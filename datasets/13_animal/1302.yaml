notes: >-
  This resource contains in vivo rat-brain ultrasound-localization-microscopy
  acquisitions released as raw RF data and beamformed ultrasound data, together
  with acquisition metadata. It does not provide a unified semantic disease or
  anatomical label set. Microbubble localization and tracking are important
  downstream ULM processing steps, but the reusable native resource is primarily
  suited to beamforming, reconstruction, and signal-analysis research. It shares
  the associated benchmarking paper with atlas entry 1301 but is a distinct
  acquisition and release rather than a subset or derived version of 1301.
