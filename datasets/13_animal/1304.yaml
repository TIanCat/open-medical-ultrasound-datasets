notes: >-
  Open-3DULM contains spatiotemporal transcranial ultrasound-localization-
  microscopy acquisitions from five awake mice and an open processing pipeline.
  The resource is intended for 3D/4D ULM reconstruction, microvascular analysis,
  and cerebral blood-flow research. Because no unified semantic or quantitative
  ground-truth annotation set is documented in the atlas source, microvascular
  analysis and blood-flow quantification are treated as downstream analyses;
  the native technical tasks are represented as reconstruction and signal analysis.
