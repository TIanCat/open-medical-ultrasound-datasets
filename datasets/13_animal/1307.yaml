  note: >-
    The Mendeley record describes GPC3-labeled microbubbles infused into a
    nude mouse bearing a HepG2 tumor in the flank. The associated paper
    reports contrast-mode imaging at a mechanical index of 0.06, a frame
    rate of 23 Hz, and an imaging depth of 3.5 cm. CEUS images were used to
    assess tumor signal enhancement and persistence after microbubble
    administration.

