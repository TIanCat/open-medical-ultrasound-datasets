notes: >-
  This resource contains contrast-ultrasound images demonstrating binding of
  GPC3-targeted microbubbles to tumor in an in-vivo mouse model of
  hepatocellular carcinoma. It accompanies a 2026 Molecular Imaging and
  Biology study on site-specific antibody-conjugated microbubbles for
  molecular CEUS imaging.

  The public dataset metadata does not document classification labels,
  segmentation masks, bounding boxes, or other machine-learning annotations.
  Accordingly, no annotation type is inferred and the native research use is
  conservatively represented as signal_analysis.

  The Mendeley record describes a nude mouse harboring a HepG2 flank tumor,
  whereas the associated paper discusses its broader in-vivo HCC imaging
  experiments. The atlas preserves the dataset-specific Mendeley description
  rather than harmonizing these model descriptions.
