notes: "Contains 1,062 images from 149 Ugandan patients: 338 images from 27 patients classified as probably COVID-19, 362 images from 67 patients with other lung disease, and 362 images from 55 healthy-lung patients. Three senior radiologists acquired the data at Mulago and Kiruddu National Referral Hospitals. Twelve thoracic regions were scanned longitudinally and transversely, initially producing 24 frames per patient; low-quality images were subsequently excluded. The patient-level split contains 723 training, 198 validation, and 141 test images. Files are JPEG or PNG with resolutions from 286 x 331 to 513 x 665 pixels. Mendeley v2 adds the original unprocessed data and processing, cleaning, and sorting scripts. The Mendeley page was accessible, but the underlying image files were not downloaded or inspected during verification."
