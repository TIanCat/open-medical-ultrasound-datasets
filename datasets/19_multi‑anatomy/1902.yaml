  note: >-
    Low- and high-quality images were acquired with different ultrasound
    systems. Volunteers held their breath briefly during paired acquisitions,
    landmarks were manually marked, and B-spline/landmark-based nonrigid
    registration was used to reduce deformation between low- and high-quality
    training images.

