verification:
  status: "verified"
  date: "2026-09-03"
  sources:
    - "https://ultrasoundenhance2023.grand-challenge.org/ultrasoundenhance2023/"
    - "https://ultrasoundenhance2023.grand-challenge.org/datasets/"
    - "https://ultrasoundenhance2023.grand-challenge.org/submissionevaluation/"
    - "https://doi.org/10.5281/zenodo.7841250"

notes: >-
  The challenge design proposed 1,500 low/high-quality pairs from 109 patients,
  with 1,050 training pairs and 450 test pairs. The current public downloads
  expose the full 1,050 training pairs but only 364 low-quality test inputs,
  with no public test reference images. The missing 86 proposed test cases
  correspond to the breast range under the released ID scheme. Public training
  pairs comprise 202 breast, 286 carotid-artery, 122 kidney, 149 liver, and
  291 thyroid pairs. The challenge-design DOI 10.5281/zenodo.7841250 is retained
  as a verification source rather than encoded as a dataset paper. The proposal
  states CC BY-SA for data use without specifying a version; its own document
  record is licensed CC BY-ND 4.0, which applies to the proposal rather than
  the ultrasound image archive.
