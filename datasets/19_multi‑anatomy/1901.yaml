notes: >-
  The repository contains 2,000 clinical ultrasound studies from 2,000 subjects,
  with approximately one third of the resource assigned to abdominal, cardiac,
  and obstetric/gynecologic imaging. The data are distributed as clinical DICOM
  resources with metadata but without a unified manual semantic-label set.
  Metadata-based anatomy or view studies are possible downstream uses, but no
  consistent atlas-wide anatomy/view ground truth is encoded as a native task.
  Because the resource is primarily useful as a broad unlabeled multi-anatomy
  imaging collection, it is categorized under pretraining. Anonymous S3 access
  is available, and the resource is managed by the MONAI Development Team.
