notes: >-
  Roboflow v1 contains 1,080 images, all assigned to the training set, with no
  preprocessing or augmentation reported. Although the project name emphasizes
  normal kidney imaging, the released segmentation classes also include liver
  and spleen; the atlas therefore records this entry under multi-anatomy with
  Abdomen as the primary anatomy and Kidney, Liver, and Spleen as targets.
  The label "Normal-Kidney" is preserved as a released segmentation class rather
  than interpreted as a separate anatomical organ. Patient count, acquisition
  institution, equipment, selection criteria, and source provenance are not
  documented. During verification, page metadata were available through search
  indexing, but direct archive access was blocked by Cloudflare; verification
  is therefore marked partial.
