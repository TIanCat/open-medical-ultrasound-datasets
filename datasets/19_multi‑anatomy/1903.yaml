id: "1903"
name: "Chinese multi-organ ultrasound image-text datasets"
full_name: "Chinese Breast, Thyroid, and Liver Ultrasound Image-Text Datasets Used for Ultrasound Report Generation"

release_year: 2024

anatomy:
  primary: "Multiple"
  target:
    - "Breast"
    - "Thyroid"
    - "Liver"

modality:
  type:
    - "Ultrasound"
  dimension: "2D"
  temporal: "static"
  representation:
    - "image"

scale:
  - unit: "patient"
    count: 7390
    note: >-
      The paper reports 7,390 patients: 3,521 breast, 2,474 thyroid,
      and 1,395 liver patients.
  - unit: "record"
    count: 7364
    note: >-
      The current public archive contains 7,364 JSON records: 3,513 breast,
      2,457 thyroid, and 1,394 liver records.
  - unit: "image"
    count: 17149
    note: "The current public archive contains 17,149 image files."

annotations:
  reports:
    unit: "record"
    type: "Chinese free-text ultrasound finding"
    format: "JSON"
    note: >-
      Each public JSON record contains a Chinese free-text finding field and
      two intended ultrasound image paths. Numerical measurements and locations
      may be replaced by special tokens during preprocessing. The archive also
      contains unsupervised clustering pseudo-labels generated from report
      embeddings; these are not treated as manual disease annotations.

tasks:
  - "report_generation"

splits:
  unit: "record"
  training:
    count: 5152
    labels: "public"
  validation:
    count: 738
    labels: "public"
  test:
    count: 1474
    labels: "public"
  note: >-
    The paper states a 7:1:2 train/validation/test split with no overlap.
    The public files do not establish whether the released uid field is a
    patient identifier, so patient-level disjointness cannot be independently
    reconstructed from the archive.

access:
  level: "open"
  license: null
  requirements: []

