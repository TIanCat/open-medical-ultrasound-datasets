notes: The paper reports 7,390 patients, not 7,390 image-report pairs, and does not separately state the report count. The current public archive has 7,364 JSON records and 17,149 images; 21 records repeat one image path instead of naming two distinct images, and 2,442 image files are not referenced by the manifests. No dataset license, consent statement, or deidentification statement was identified.