  countries:
    - "China"
  institutions:
    - "Ultrasound Department, PLA General Hospital"
  period: null
  scanners: null
  transducers: null
  frequencies: null
  note: >-
    The associated paper reports institutional review board identifier
    YSB-2020-Y0902. A dataset-specific consent statement and deidentification
