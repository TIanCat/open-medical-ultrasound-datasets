family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-03"
  sources:
    - "https://arxiv.org/html/2406.00644"
    - "https://doi.org/10.1109/TMI.2024.3424978"
    - "https://github.com/LijunRio/Ultrasound-Report-Generation"
    - "https://lijunrio.github.io/Ultrasound-Report-Generation/"

notes: >-
  The paper reports 7,390 patients rather than 7,390 image-report pairs and
  does not separately state a report count. The current public archive contains
  7,364 JSON records and 17,149 images. Every released record has a non-empty
  finding field and two image-path entries, although 21 records repeat the same
  image path rather than naming two distinct images. The manifests reference
  14,707 distinct image files, leaving 2,442 released images unreferenced.
  The public record count is 26 lower than the paper cohort count across the
  three organs. No dataset-specific license was identified. Unsupervised report
  clustering, pseudo-label learning, and image-text feature alignment are
  methodological settings of the associated study rather than additional native
  annotation tasks.
