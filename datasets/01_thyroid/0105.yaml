notes: >-
  TN3K contains 3,493 grayscale thyroid ultrasound images from 2,421 patients.
  Samples were selected from more than 30,000 candidate images and may contain
  one or multiple nodules. The public release is intended for thyroid-nodule
  segmentation; a benign/malignant classification label should not be assumed
  for TN3K merely because some project code or related repositories contain
  classification utilities.
