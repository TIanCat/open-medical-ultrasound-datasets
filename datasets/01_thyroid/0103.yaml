notes: >-
  The full dataset contains 3,668 B-mode ultrasound videos. For key-frame
  localization, 23,219 frames were extracted to train a Faster R-CNN-based
  nodule detector, and the 3,668 videos were split into 2,648 training,
  504 validation, and 516 test videos. The paper reports a separate
  244-video benign/malignant classification subset from the localization
  test cohort because the full label distribution was highly imbalanced.
  The repository provides the ultrasound data through Baidu Netdisk and
  does not state a formal dataset license.
