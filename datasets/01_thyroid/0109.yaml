notes: >-
  This is the original public 3D thyroid ultrasound resource introduced
  by Wunderling et al. in 2017. It contains tracked 3D ultrasound records
  with expert thyroid-gland ground-truth segmentations. TG3K (0104) was
  subsequently derived from these recordings by extracting 2D frames and
  retaining frames in which the thyroid gland occupies more than 6% of
  the image area.