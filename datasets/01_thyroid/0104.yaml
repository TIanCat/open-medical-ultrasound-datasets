notes: TG3K is not an independent clinical acquisition. Gong et al. constructed it by extracting 2D frames from the 16 tracked 3D thyroid ultrasound records introduced by Wunderling et al. (2017), retaining frames in which the thyroid gland occupies more than 6% of the image. The 2022 paper reports 3,585 retained images. Some secondary resources report 3,583 frames; the atlas uses the count stated in the primary 2022 paper. The original 3D source dataset is not yet represented by a separate atlas ID, so family.parent is left null and the source family is recorded under family.related.
