notes: >-
  The dataset was released for the MICCAI 2020 TN-SCUI challenge. Each image is
  associated with a benign/malignant label and a detailed nodule delineation.
  The Zenodo DOI 10.5281/zenodo.3715942 identifies the accepted challenge design
  document rather than a peer-reviewed dataset paper or the image archive itself,
  so it is not entered under paper.doi or data.doi.
