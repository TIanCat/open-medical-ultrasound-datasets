notes: >-
  TN5000 contains 5,000 B-mode thyroid nodule images selected from more than
  30,000 candidate images. Each image contains at least one discernible nodule
  and is distributed with PASCAL VOC-compatible bounding-box annotations and
  benign/malignant labels confirmed by FNA biopsy and pathological results.
  The official split is 3,500 training, 500 validation, and 1,000 test images.
