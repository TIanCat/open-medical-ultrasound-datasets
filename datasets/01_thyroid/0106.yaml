id: "0106"
name: "SegThy"
full_name: "SegThy Dataset"
aliases: []

release_year: 2022

anatomy:
  primary: "Thyroid"
  target:
    - "Thyroid gland"

modality:
  type:
    - "B-mode"
    - "MRI"
  dimension: "3D"
  temporal: "sweep"
  representation:
    - "volume"

scale:
  - unit: "participant"
    count: 214
    note: "28 healthy volunteers in sub-dataset 1 and 186 clinical patients in sub-dataset 2."

annotations:
  segmentation:
    unit: "volume"
    type: "binary"
    targets:
      - "Thyroid gland"
    format: "voxel_mask"
    note: >-
      Sub-dataset 1 provides thyroid label maps for both reconstructed 3D ultrasound
      and MRI. The public dataset page also describes thyroid labels for the tracked
      3D ultrasound data.

  measurements:
    unit: "volume"
    targets:
      - "Thyroid volume"
    format: "derived_from_segmentation"

tasks:
  - "segmentation"
  - "measurement"

access:
  level: "open"
  license: "CC BY"
  requirements: []

paper:
  title: "Tracked 3D Ultrasound and Deep Neural Network-Based Thyroid Segmentation Reduce Interobserver Variability in Thyroid Volumetry"
  venue: "PLOS ONE"
  doi: "10.1371/journal.pone.0268550"

data:
  repository: "Technical University of Munich"
  url: "https://www.cs.cit.tum.de/en/camp/publications/segthy-dataset/"
  doi: null
  version: null

acquisition:
  countries:
    - "Germany"
  institutions:
    - "Technical University of Munich"
  period: null
  scanners:
    - "Siemens Acuson NX-3"
    - "Siemens Biograph mMR"
  transducers:
    - "VF12-4"
  frequencies:
    - "12 MHz"
  note: >-
    Freehand 2D ultrasound was electromagnetically tracked with the Piur tUS system
    and reconstructed into 3D volumes. MRI in sub-dataset 1 used a 3 T T1-weighted
    VIBE sequence.

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-04"
  sources:
    - "https://www.cs.cit.tum.de/en/camp/publications/segthy-dataset/"
    - "https://doi.org/10.1371/journal.pone.0268550"

notes: >-
  SegThy contains two related cohorts totaling 214 participants. Sub-dataset 1
  contains 28 healthy volunteers with tracked 3D ultrasound and MRI, whereas
  sub-dataset 2 contains 186 clinical thyroid patients with tracked 3D ultrasound.
  The associated PLOS ONE volumetry study focuses on the 28-volunteer cohort.
