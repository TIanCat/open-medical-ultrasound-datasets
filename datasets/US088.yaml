notes: >-
  The archive contains 250 training and 50 testing four-chamber ultrasound
  images. Each image has fetal cardiac and thoracic ellipse annotations,
  rectangle or rotated-box annotations, and separate binary PNG masks.
  The count of 217 subjects is reported by subsequent technical reports but
  is not stated in the Zenodo description. The 61.2 MB Zenodo file endpoint
  and archive preview were both verified.
