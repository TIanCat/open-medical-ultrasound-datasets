id: "1203"
name: "MMOTU"
full_name: "Multi-Modality Ovarian Tumor Ultrasound Image Dataset"
aliases:
  - "Multi-Modality Ovarian Tumor Ultrasound"
  - "OTU_2D + OTU_CEUS"

release_year: 2022

anatomy:
  primary: "Ovary"
  target:
    - "Ovarian tumor"

modality:
  type:
    - "B-mode"
    - "Color Doppler"
    - "Contrast-enhanced ultrasound"
  dimension: "2D"
  temporal: "static"
  representation:
    - "image"

scale:
  - unit: "patient"
    count: 294
  - unit: "image"
    count: 1639
    note: >-
      The dataset contains 1,469 images in the OTU_2D subset and
      170 images in the OTU_CEUS subset.
  - unit: "pair"
    count: 1639
    note: >-
      Pixel-wise semantic annotations are provided for images in
      both OTU_2D and OTU_CEUS.

annotations:
  classification:
    unit: "image"
    label_type: "multiclass"
    num_classes: 8
    classes:
      - "Chocolate cyst"
      - "Serous cystadenoma"
      - "Teratoma"
      - "Theca cell tumor"
      - "Simple cyst"
      - "Normal ovary"
      - "Mucinous cystadenoma"
      - "High-grade serous"
    annotators:
      - "27 Obstetrics and Gynecology experts"
    reference_standard: "Pathological reports"
    note: >-
      Global category annotations are provided for both subsets.
      OTU_2D contains eight categories including Normal ovary.
      The original paper describes OTU_CEUS as a seven-category
      tumor-recognition setting when Normal ovary is excluded.

  segmentation:
    unit: "image"
    type: "binary"
    targets:
      - "Ovarian tumor"
    format: "PNG_mask"
    count: 1639
    annotators:
      - "27 Obstetrics and Gynecology experts"
    annotation_method: >-
      Each image was initially annotated by one expert and subsequently
      checked by another expert, with pathological reports used as
      clinical reference.
    note: >-
      The original semantic annotations preserve tumor-category
      information, while the official segmentation implementation
      converts them into binary background-versus-ovarian-tumor masks.

tasks:
  - "classification"
  - "segmentation"

splits:
  unit: "image"
  training:
    count: 1070
    note: >-
      OTU_2D: 1,000 images from 171 patients.
      OTU_CEUS: 70 images from 20 patients.
  test:
    count: 569
    note: >-
      OTU_2D: 469 images from 76 patients.
      OTU_CEUS: 100 images from 27 patients.
      The original dataset construction maintains patient independence
      between training and test sets.

