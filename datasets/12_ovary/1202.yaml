notes: >-
  This resource was posted to Figshare on 2024-11-12 by Indirani A and is
  intended for automated PCOS detection and explainable-AI research. The
  Figshare metadata explicitly states that the images were sourced from
  publicly available datasets, so this entry is classified as an aggregate
  rather than a primary clinical dataset.

  The primary Figshare record reports 12,680 ultrasound images but does not
  document the contributing source datasets, patient count, acquisition
  institutions, scanner information, official train/validation/test split, or
  class distribution. Later publications using the same Figshare DOI generally
  describe the data as grayscale ovarian ultrasound images for binary PCOS
  classification and commonly report 11,784 usable images, comprising 6,784
  PCOS and 5,000 non-PCOS images. This discrepancy cannot be fully reconciled
  from the public metadata, so 12,680 is retained as the canonical repository
  count and verification.status is set to partial.

  No dedicated associated dataset publication is listed by Figshare or the
  NLM Dataset Catalog. Later papers using the resource are therefore treated
  as downstream studies rather than as the dataset's primary paper.