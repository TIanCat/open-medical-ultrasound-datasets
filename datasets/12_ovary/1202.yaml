id: "1202"
name: "PCOS Dataset"
full_name: "Figshare Polycystic Ovary Syndrome Ultrasound Dataset"
aliases:
  - "Figshare PCOS Dataset"
  - "PCOS Ultrasound Dataset"

release_year: 2024

anatomy:
  primary: "Ovary"
  target:
    - "Ovary"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "static"
  representation:
    - "image"

scale:
  - unit: "image"
    count: 12680
    note: >-
      The Figshare record states that the dataset contains 12,680 ultrasound
      images. Several downstream studies using this resource instead report
      11,784 binary-classification images, including 6,784 PCOS and 5,000
      non-PCOS images. Because the Figshare record is the primary source,
      12,680 is retained as the canonical catalog count.

annotations:
  classification:
    unit: "image"
    num_classes: 2
    classes:
      - "PCOS"
      - "Non-PCOS"
    note: >-
      Downstream studies consistently describe the released resource as a
      binary PCOS-versus-non-PCOS ovarian ultrasound classification dataset.
      However, the Figshare metadata does not provide an official class
      distribution. Several studies report a usable subset of 6,784 PCOS and
      5,000 non-PCOS images, totaling 11,784 images.

