notes: >-
  PCOSGen was developed for the Auto-PCOS Classification Challenge and
  aggregates ovarian ultrasound frames collected from multiple internet
  resources, including YouTube, ultrasoundcases.info, and Kaggle. The
  dataset therefore does not represent a single prospective or retrospective
  clinical cohort and is classified as an aggregate dataset.

  The original PCOSGen-train release appeared on Zenodo in December 2023
  under record 10430727. The authors subsequently released an updated
  training dataset under record 14592001 on January 3, 2025 and explicitly
  requested that researchers use the updated release rather than previous
  versions. It contains 3,200 images, with inconsistent resolutions but most
  images approximately 300 x 300 pixels.

  PCOSGen-test contains 1,468 images. Test labels were initially withheld
  during the Auto-PCOS challenge and were later made public. The updated
  test release is Zenodo record 14591782. Together, the official training
  and test resources contain 4,668 ultrasound images.

  The latest Zenodo descriptions provide two levels of classification:
  a general normal-versus-abnormal label and, for abnormal images, a
  specific indication of whether a polycystic ovary is visible. No native
  segmentation, detection, landmark, or measurement annotations are
  documented.

  A dataset-specific license could not be unambiguously confirmed from the
  currently retrievable Zenodo metadata, so access.license is conservatively
  left null.