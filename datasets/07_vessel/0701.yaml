notes: >-
  This entry represents the UK Biobank carotid-ultrasound resource family rather
  than a single frozen benchmark release. Participant and image counts therefore
  vary by selected data field and release. The resource supports carotid phenotype
  and intima-media-thickness analysis through linkage with UK Biobank participant
  metadata. It is application-controlled rather than an open-download dataset.
