notes: "Contains ten consecutive 434 × 636 B-mode frames from each of 55 severely obese patients. Wedge-biopsy steatosis percentage is provided as the reference standard; fatty liver is defined as more than 5% of hepatocytes with steatosis. The cohort contains 38 fatty-liver and 17 non-fatty-liver patients."
