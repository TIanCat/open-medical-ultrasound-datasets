notes: >-
  BraTioUS contains 1,669 intraoperative B-mode ultrasound images from 142
  glioma patients, together with tumor segmentation masks and a metadata spreadsheet.
  Tumor/no-tumor image classification can be derived from the segmentation masks,
  but no independent native classification annotation is required, so classification
  is not encoded as a separate task. This entry uses the latest verified Zenodo
  record dated 2026-06-22; the concept DOI is 10.5281/zenodo.16887362.
