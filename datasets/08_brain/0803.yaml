notes: >-
  This is a small unlabeled 3D transfontanellar ultrasound neuroimage resource
  with supporting files. The earlier atlas entry listed data augmentation,
  2D slice synthesis, GAN training, and representation research as tasks, but
  these are modeling uses rather than native annotations. Because the current
  schema requires at least one task for an unlabeled reusable image resource,
  it is categorized under the generic pretraining task. No consistent manual
  semantic-segmentation labels or dedicated peer-reviewed dataset paper were verified.
  The entry was updated from the earlier 2025 Zenodo record 14917169 to the
  2026 record with supporting information.
