id: "0801"
name: "BITE"
full_name: "Brain Images of Tumors for Evaluation"

release_year: 2012

anatomy:
  primary: "Brain"
  target:
    - "Brain tumor"
    - "Resection cavity"

modality:
  type:
    - "B-mode"
    - "MRI"
  dimension: "mixed"
  temporal: "mixed"
  representation:
    - "sequence"
    - "volume"

scale:
  - unit: "patient"
    count: 14

annotations:
  registration:
    unit: "case"
    modalities:
      - "B-mode"
      - "MRI"
    format: "homologous_landmarks"
    note: >-
      Expert-selected homologous landmarks are stored in .tag files and support
      MRI-ultrasound, pre-/post-resection ultrasound, and pre-/post-operative MRI
      registration evaluation.

tasks:
  - "registration"

access:
  level: "open"
  license: null
  requirements: []

paper:
  title: "Online database of clinical MR and ultrasound images of brain tumors"
  venue: "Medical Physics"
  doi: "10.1118/1.4709600"

data:
  repository: "Montreal Neurological Institute"
  url: "https://nist.mni.mcgill.ca/bite-brain-images-of-tumors-for-evaluation-database/"
  doi: null
  version: null

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-03"
  sources:
    - "https://nist.mni.mcgill.ca/bite-brain-images-of-tumors-for-evaluation-database/"
    - "https://doi.org/10.1118/1.4709600"

notes: >-
  BITE contains data from 14 brain-tumor patients organized into four downloadable
  groups: pre-/post-resection ultrasound, preoperative MRI with pre-resection
  ultrasound, pre-/post-operative MRI, and preoperative MRI with post-resection
  ultrasound. Ultrasound data include original 2D B-mode sweeps and reconstructed
  3D volumes. Tumor segmentation masks are not provided. Images primarily use
  MINC format. Target-registration-error analysis is an evaluation derived from
  the landmark annotations rather than a separate native task.
