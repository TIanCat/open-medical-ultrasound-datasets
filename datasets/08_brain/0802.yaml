notes: >-
  RESECT contains 23 low-grade-glioma surgery cases with preoperative MRI and
  intraoperative ultrasound. The core resource provides anatomical landmarks for
  MRI-iUS registration evaluation. Related extension resources add tumor and
  resection-cavity segmentation labels, but those extensions are not treated here
  as native annotations of the core RESECT entry. No explicit reusable data license
  was confirmed on the accessible landing page.
