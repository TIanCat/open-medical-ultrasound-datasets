  acquisition_period: Not confirmed from accessible article text or released metadata

quality_checks:
  metadata_rows: 1875
  unique_case_ids: 1064
  complete_image_mask_pairs: 1875
  empty_masks: 0
  image_mask_dimension_mismatches: 0
  exact_duplicate_images: 0
  pathology_conflicts_within_case: 0
  official_split_files_cover_all_images: true
  bbox_mask_exact_matches: 1874
  bbox_mask_mismatches: 1

family:
  type: primary
  parent: null

verified:
  date: 2026-09-03
  methods:
    - Read the official article abstract and data-availability statement
    - Queried the Zenodo API for version, license, file size, and checksum
    - Downloaded and integrity-tested the complete official archive
    - Parsed all metadata and split rows and decoded every image and mask PNG header
    - Verified all masks are nonempty and every image-mask pair has matching dimensions; compared every BBOX with its mask extent
    - Checked patient grouping in outer folds and inner validation flags separately
  sources:
    - https://doi.org/10.1002/mp.16812
    - https://doi.org/10.5281/zenodo.8231412
    - https://zenodo.org/api/records/8231412
    - https://github.com/wgomezf/BUS-BRA

notes: The published patient count is exactly 1,064, not a 1,064-1,070 range. Patient-level counts (722 benign, 342 malignant) and image-level counts (1,268 benign, 607 malignant) refer to different units. One BBOX (bus_0845-s) does not match its released mask. The supplied outer folds keep paired views together, but the separate inner-validation flags do not always do so.