id: US008
name: BUS-BRA
full_name: BUS-BRA - A Breast Ultrasound Dataset for Assessing Computer-aided Diagnosis Systems
release_year: 2023
release_year_basis: Zenodo version 1.0 was created on 2023-08-09; the article was published online on 2023-11-08 and assigned to a 2024 issue

anatomy:
  primary: Breast
  target: Breast tumor

modality:
  type: B-mode ultrasound
  dimension: 2D
  temporal: static
  released_image_format: 8-bit grayscale PNG
  released_mask_format: 1-bit grayscale PNG
  released_resolution:
    width_range_pixels: 240-579
    height_range_pixels: 268-478

scale:
  patients: 1064
  patient_sex: Female
  images: 1875
  masks: 1875
  views_per_patient:
    one_image: 253
    two_orthogonal_images: 811
  patient_class_distribution:
    benign: 722
    malignant: 342
  image_class_distribution:
    benign: 1268
    malignant: 607
  image_birads_distribution:
    category_2: 562
    category_3: 463
    category_4: 693
    category_5: 157
  patient_birads_distribution:
    category_2: 304
    category_3: 279
    category_4: 393
    category_5: 88

annotations:
  pathology:
    available: true
    unit: patient / lesion, propagated to images
    classes:
      - Benign
      - Malignant
    reference_standard: Biopsy-proven
  histology:
    available: true
    unit: patient / lesion, propagated to images
    distinct_values_in_metadata: 28
  birads:
    available: true
    unit: patient / lesion, propagated to images
    categories:
      - 2
      - 3
      - 4
      - 5
    annotator: Senior ultrasonographer
  segmentation:
    available: true
    unit: image
    target: Tumor versus normal region
    type: Binary mask
    method: Manually outlined by the senior ultrasonographer
    pairing: Every image has a same-size mask
  bounding_boxes:
    available: true
    unit: image
    format: BBOX column in bus_data.csv
    convention: MATLAB-style one-based x/y and width/height extents
    mask_consistency: 1,874 of 1,875 boxes exactly match the nonzero mask extent under this convention
    known_mismatch: bus_0845-s has BBOX [214, 77, 164, 100], while its mask extent is [292, 108, 86, 69]

tasks:
  - Breast lesion segmentation
  - Breast lesion detection and localization
  - Benign versus malignant pathology classification
  - BI-RADS 2/3/4/5 classification
  - Exploratory histologic-subtype classification, subject to severe class imbalance

splits:
  supplied:
    - 5-fold cross-validation
    - 10-fold cross-validation
  outer_fold_patient_grouping: All images from a patient have the same kFold value
  inner_validation_warning:
    description: The per-fold valid_N flags are not consistently grouped by patient for two-view cases; regenerate them if validation must be fully patient-disjoint
    affected_patients_in_5_fold_file: 642
    affected_patients_in_10_fold_file: 783

access:
  level: open
  registration_required: false
  zenodo_license: CC BY 4.0
  archive_license: Custom permissive notice requiring citation and retention of the copyright and permission notice
  copyright_holder: Program of Biomedical Engineering, Federal University of Rio de Janeiro (PEB/COPPE-UFRJ), Brazil

paper:
  title: BUS-BRA - A breast ultrasound dataset for assessing computer-aided diagnosis systems
  authors:
    - Wilfrido Gómez-Flores
    - Maria Julia Gregorio-Calas
    - Wagner Coelho de Albuquerque Pereira
  venue: Medical Physics
  publication_year: 2024
  online_publication_date: 2023-11-08
  volume: 51
  issue: 4
  pages: 3110-3123
  doi: 10.1002/mp.16812

