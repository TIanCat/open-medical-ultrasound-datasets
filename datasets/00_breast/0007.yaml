notes: >-
  The dataset contains 232 breast lesions, including 109 benign and 123 malignant
  lesions. Each lesion is represented by an original ultrasound image together with
  lesion-related annotation files on the official site. Patient-level identifiers,
  an official train/validation/test split, and a formal dataset license are not
  provided. The paper lists fine-needle aspiration, core-needle biopsy, and open biopsy
  among the reference methods; therefore, the broad label "histopathologically proven"
  should be interpreted with caution because fine-needle aspiration is cytologic sampling.
