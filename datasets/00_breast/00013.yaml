verified:
  date: 2026-09-03
  methods:
    - Read the publisher article record, author code repository, and Kaggle API metadata
    - Downloaded and integrity-tested Kaggle version 1
    - Parsed every label row in BD3M.xlsx and matched all IDs to case directories
    - Enumerated all 1,532 JPEGs by patient and modality and decoded their headers
    - Visually inspected representative BUS, DUS, and EUS files to confirm their image appearances
    - Checked exact-file duplicates and per-patient modality completeness
  sources:
    - https://doi.org/10.1016/j.inffus.2024.102592
    - https://www.sciencedirect.com/science/article/pii/S1566253524003701
    - https://github.com/TimesXY/TDF_Net
    - https://www.kaggle.com/datasets/timesxy/multimodal-breast-ultrasound-dataset-us3m
    - https://www.kaggle.com/api/v1/datasets/view/timesxy/multimodal-breast-ultrasound-dataset-us3m

notes: The release contains 248 complete three-modality case folders and 1,532 images, not 248 images or unspecified samples. The pathology-result workbook provides only binary labels and folder IDs; no masks, clinical variables, acquisition details, or official split are included. Missing modalities are simulated by the TDF-Net study rather than absent from the released cases.