id: US013
name: US3M
full_name: Multimodal Breast Ultrasound Dataset US3M
release_year: 2024
release_year_basis: Kaggle version 1 was published on 2024-06-09

anatomy:
  primary: Breast
  target: Breast tumor

modality:
  type: Multimodal ultrasound
  dimension: 2D
  temporal: static
  modalities:
    - name: Conventional B-mode ultrasound
      released_prefix: BUS
      images: 781
    - name: Color Doppler ultrasound / color Doppler flow imaging
      released_prefix: DUS
      images: 253
    - name: Ultrasound elastography
      released_prefix: EUS
      images: 498
  released_format: 8-bit RGB JPEG
  released_resolution:
    width_range_pixels: 370-708
    height_range_pixels: 255-568
    distinct_width_height_pairs: 755

scale:
  patients_or_case_folders: 248
  images: 1532
  class_distribution:
    benign: 145
    malignant: 103
  images_per_patient:
    bus_range: 1-9
    dus_range: 1-2
    eus_range: 1-3

annotations:
  diagnosis:
    available: true
    unit: patient/case folder
    classes:
      0: Benign
      1: Malignant
    source_field: "病理结果 (pathology result) in BD3M.xlsx"
    pathology_details: Not provided in the released files
  segmentation_masks: false
  clinical_metadata: false

tasks:
  - Multimodal benign-versus-malignant breast tumor classification
  - Classification under simulated missing-modality conditions
  - Multimodal feature fusion and missing-modality feature reconstruction

missing_modality_scope:
  released_cases_have_all_three_modalities: true
  meaning_in_paper: Modalities are removed or masked experimentally; the public dataset is not intrinsically incomplete

splits:
  official_train_validation_test_split: Not provided in the public archive or author repository
  patient_grouping_available: true

access:
  level: open download for non-commercial use
  registration_required: Kaggle account may be required through the website; API download worked without authentication during verification
  license: CC BY-NC 4.0
  author_repository_wording: Research or educational purposes and non-commercial use only

ethics_and_acquisition:
  institution: Second Affiliated Hospital of Harbin Medical University
  acquisition_period: Not reported in the public data card
  devices: Not reported in the public data card or released files
  ethics_approval: Not identified in accessible primary metadata
  consent_statement: Not identified in accessible primary metadata
  deidentification_statement: Not identified in accessible primary metadata

