id: 0001
name: UDIAT / Dataset B
full_name: Breast Ultrasound Dataset B
release_year: 2017

anatomy:
  primary: Breast
  target: Breast lesion

modality:
  type: B-mode
  dimension: 2D
  temporal: static

scale:
  images: 163
  patients: 163
  class_distribution:
    benign: 110
    malignant: 53
  mean_image_size: 760 x 570 pixels

annotations:
  classification:
    num_classes: 2
    classes:
      - Benign
      - Malignant
  segmentation:
    available: true
    targets:
      - Breast lesion
    annotators: Experienced radiologists
  diagnostic_subtypes_reported_in_paper:
    benign:
      unspecified_cysts: 65
      fibroadenomas: 39
      other: 6
    malignant:
      invasive_ductal_carcinomas: 40
      ductal_carcinomas_in_situ: 4
      invasive_lobular_carcinomas: 2
      other: 7

tasks:
  - Lesion detection/localization
  - Lesion segmentation
  - Benign/malignant classification

access:
  level: application
  license: Research-use licence agreement; exact terms must be reviewed before use
  requirements:
    - Institutional email address
    - Submitted licence agreement
    - Manual approval
  processing_time: Up to 10 working days

paper:
  title: Automated Breast Ultrasound Lesions Detection Using Convolutional Neural Networks
  venue: IEEE Journal of Biomedical and Health Informatics
  publication_year: 2018
  online_year: 2017
  doi: 10.1109/JBHI.2017.2731873
  pmid: 28796627

data:
  repository: Manchester Metropolitan University
  url: https://helward.mmu.ac.uk/STAFF/m.yap/dataset.php
  download: Provided after application approval

acquisition:
  year: 2012
  institution: UDIAT Diagnostic Centre, Parc Tauli Corporation, Sabadell, Spain
  scanner: Siemens ACUSON Sequoia C512
  transducer: 17L5 HD linear array
  frequency: 8.5 MHz

family:
  type: primary
  parent: null

verified:
  date: 2026-09-02
  sources:
    - https://e-space.mmu.ac.uk/619005/1/revised_manuscript_R2.pdf
    - https://pubmed.ncbi.nlm.nih.gov/28796627/
    - https://helward.mmu.ac.uk/STAFF/m.yap/dataset.php

notes: Images are from different women and may contain one or more lesions. The paper reports lesion delineations by experienced radiologists. The dataset is not a direct open download under the current access workflow.
