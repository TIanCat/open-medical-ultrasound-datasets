id: US006
name: Breast lesion ultrasound video dataset
name_source: Descriptive name used in the original paper; the paper does not assign a formal dataset name
aliases:
  - BUSV
  - BUV
  - BreastVid
alias_note: These short names are used by later papers and dataset catalogs rather than defined by the original paper
release_year: 2022

anatomy:
  primary: Breast
  target: Breast lesion

modality:
  type: B-mode ultrasound
  dimension: 2D
  temporal: video
  released_representation: Extracted PNG frames grouped by video
  image_resolution: Not reported in the paper or repository README

scale:
  paper_reported_videos: 188
  paper_reported_frames: 25272
  frames_per_video_range: 28-413
  paper_reported_class_distribution:
    benign_videos: 75
    malignant_videos: 113
  subjects: Not reported
  subject_note: Videos must not be treated as unique patients; the repository correction identifies four videos from the same patient

annotations:
  detection:
    available: true
    unit: frame
    type: Breast lesion rectangle / bounding box
    coverage: Each video frame, as stated by the paper
  classification:
    available: true
    unit: video lesion
    classes:
      - Benign
      - Malignant
  annotators:
    number: 2
    description: Pathologists with eight years of experience in breast pathology, as stated by the paper
    agreement_or_adjudication: Not reported
  segmentation_masks:
    available: false

tasks:
  - Frame-level breast lesion detection and localization
  - Video-level benign versus malignant lesion classification

split:
  paper_protocol:
    training_videos: 150
    testing_videos: 38
    selection: The paper states that 38 videos were randomly selected as the test set
  repository_files:
    - train.json
    - val.json
  split_caution: The repository's 2023 data-correction notice does not state revised split counts; users should inspect the downloaded JSON after applying the announced corrections

access:
  level: open with use restrictions
  registration_required: false for the Google Drive link during verification
  permitted_uses:
    - Non-commercial research
    - Education
  modification_permission: The repository README permits editing or processing images and annotations for the permitted uses
  commercial_use: Not permitted by the repository statement
  formal_dataset_license: Not supplied
  repository_license_file: Present but empty at verified commit

paper:
  title: A New Dataset and a Baseline Model for Breast Lesion Detection in Ultrasound Videos
  authors:
    - Zhi Lin
    - Junhao Lin
    - Lei Zhu
    - Huazhu Fu
    - Jing Qin
    - Liansheng Wang
  venue: Medical Image Computing and Computer Assisted Intervention (MICCAI 2022)
  series: Lecture Notes in Computer Science
  volume: 13433
  pages: 614-623
  publication_year: 2022
  online_publication_date: 2022-09-16
  doi: 10.1007/978-3-031-16437-8_59
  arxiv: 2207.00141

data:
  official_repository: https://github.com/jhl-Det/CVA-Net
  verified_commit: 4c954035a9d61165f24b02bfa15c0f1468372ff2
  google_drive: https://drive.google.com/file/d/1LVXK34OJhC2LkqqyMmVFnXsXQavvZdeF/view?usp=sharing
  baidu_drive: https://pan.baidu.com/s/1yYME7-DvvIEZzCb72NXaJA?pwd=jnie
  archive:
    filename: Miccai 2022 BUV Dataset.7z
    size_bytes: 4206824798
    format: 7z
  expected_layout:
    frame_directory: rawframes
    annotation_files:
      - train.json
      - val.json

acquisition:
  systems_as_reported:
    - LOGIQ-E9
    - PHILIPS TIS L9-3
  institution: Not reported
  acquisition_period: Not reported
  scanning_description: Each video follows a complete scan from lesion appearance to its largest section and then disappearance

quality_notes:
  paper_typo: The contribution list and dataset paragraph each say 118 videos, but the abstract, class counts (75 + 113), test split, and conclusion support 188 videos
  repository_correction_date: 2023-03-25
  repository_correction:
    duplicate_and_wrong_label: Delete rawframes/benign/x66ef02e7f1b9a0ef because it duplicates a malignant video and should be malignant
    same_patient_videos:
      - benign/x63c9ba1377f35bf6 (97 frames)
      - benign/x5a1c46ec6377e946 (100 frames)
      - malignant/2390fbea047347b (102 frames)
      - malignant/7a39ab5d4970bf89 (105 frames)
    correction_for_same_patient_videos: The README states that all four should be labeled malignant and that some frames overlap
    revised_totals: Not explicitly reported by the repository; not inferred here
  archive_inspection: The 4.2 GB archive header, filename, size, and accessibility were verified with byte-range requests; the complete archive was not downloaded

family:
  type: primary
  parent: null

verified:
  date: 2026-09-03
  methods:
    - Read the author-submitted arXiv source and Springer metadata
    - Cloned and inspected the official CVA-Net repository at the recorded commit
    - Verified that the CSV's former jhl-Det/BreastVid repository does not exist
    - Checked the official Google Drive warning page and 7z header using byte-range requests
    - Recorded the repository's 2023 duplicate, patient-overlap, and label corrections without inferring revised totals
  sources:
    - https://doi.org/10.1007/978-3-031-16437-8_59
    - https://arxiv.org/abs/2207.00141
    - https://github.com/jhl-Det/CVA-Net
    - https://drive.google.com/file/d/1LVXK34OJhC2LkqqyMmVFnXsXQavvZdeF/view?usp=sharing

notes: The original paper does not name the dataset BUSV or BreastVid and does not report the number of patients, acquisition institution, acquisition period, image resolution, diagnostic reference standard, or annotation-adjudication procedure. The empty repository LICENSE file is not a license grant; use is governed only by the non-commercial research/education statement in the README.