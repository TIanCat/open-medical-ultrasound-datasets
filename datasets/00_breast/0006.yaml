notes: >-
  The original paper does not assign a formal dataset name; BUSV, BUV, and BreastVid
  are aliases used in later literature or catalogs. The repository distributes extracted
  PNG frames grouped by video rather than conventional encoded video files. A 2023
  repository correction identifies one duplicated/wrongly labelled video and four
  same-patient videos requiring label correction; revised global totals were not
  explicitly reported, so the scale and class distribution above retain the
  paper-reported values with this caveat.
