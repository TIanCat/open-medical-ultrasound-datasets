notes: >-
  The release contains 811 image-mask pairs, comprising 358 benign and
  453 malignant images. The Mendeley page states that the source images were
  obtained from Ultrasound Cases and were subsequently annotated by an experienced
  radiologist. Patient identifiers, patient count, acquisition device, diagnostic
  reference standard, and an official split are not reported. One checked public
  mirror contains a one-pixel image-mask dimension mismatch for file 0319.png.
