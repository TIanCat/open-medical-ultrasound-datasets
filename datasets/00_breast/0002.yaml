signal_data:
  scan_planes_per_lesion: 2
  scan_plane_relation: "orthogonal"
  b_mode_included: false
  b_mode_derivable_from_rf: true

notes: >-
  Each lesion has two orthogonal RF acquisitions with paired binary ROI masks.
  B-mode images are not stored directly but can be generated from the RF echoes.
  Malignant lesions were histologically assessed by core-needle biopsy; some benign
  lesions were histologically assessed and the remainder were followed for two years.
  The two acquisitions from the same lesion should remain together when creating data splits.

