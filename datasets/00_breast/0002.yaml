  target:
    - "Breast focal lesion"

modality:
  type:
    - "RF"
  dimension: "2D"
  temporal: "static"
  representation:
    - "signal"

scale:
  - unit: "patient"
    count: 78
  - unit: "lesion"
    count: 100
  - unit: "acquisition"
    count: 200

annotations:
  classification:
    unit: "lesion"
    num_classes: 2
    classes:
