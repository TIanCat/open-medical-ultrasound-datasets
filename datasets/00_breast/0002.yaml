id: 0002
name: OASBUD
full_name: Open Access Series of Breast Ultrasonic Data
release_year: 2017

anatomy:
  primary: Breast
  target: Breast focal lesion

modality:
  type: Post-beamformed radio-frequency ultrasound echo-line data
  dimension: 2D
  temporal: static
  scan_planes_per_lesion: 2
  scan_plane_relation: Orthogonal
  b_mode:
    included: false
    representations_can_be_generated_from_rf: true

scale:
  patients: 78
  patient_population: Women
  lesions: 100
  rf_scan_planes: 200
  roi_masks: 200
  class_distribution:
    benign_lesions: 48
    malignant_lesions: 52

annotations:
  classification:
    unit: lesion
    num_classes: 2
    classes:
      - Benign
      - Malignant
  birads:
    unit: lesion
    categories:
      - "3"
      - "4a"
      - "4b"
      - "4c"
      - "5"
    distribution:
      "3": 31
      "4a": 11
      "4b": 16
      "4c": 17
      "5": 25
    distribution_source: Parsed from the checksum-verified OASBUD.mat release
  segmentation:
    available: true
    unit: scan plane
    type: Binary ROI mask aligned with the RF matrix
    targets:
      - Breast lesion
  diagnostic_reference:
    malignant: Histologically assessed by core-needle biopsy
    benign: Some histologically assessed; the remainder observed over a 2-year period

tasks:
  - Benign/malignant lesion classification
  - Lesion segmentation using the supplied ROI masks
  - Quantitative ultrasound / RF signal analysis
  - B-mode representation generation and ultrasound image processing

