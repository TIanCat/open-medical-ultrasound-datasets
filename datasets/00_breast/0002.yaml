notes: OASBUD is the name commonly used in later literature; the original Zenodo record uses the data-paper title. Each lesion has two orthogonal RF scans with paired binary ROI masks. B-mode images are not stored; B-mode-style representations can be generated from the RF echoes. The paper reports no official train/test split. The two planes from one lesion must remain together when creating data splits, while the mapping from 100 lesion records to 78 women cannot be reliably reconstructed from the MAT file alone. The MAT file contains no histopathology images or separate clinical table.
