      - "4B"
      - "4C"
      - "5"
    distribution:
      "3": 31
      "4A": 11
      "4B": 16
      "4C": 17
      "5": 25

  segmentation:
    unit: "acquisition"
    type: "binary"
    targets:
      - "Breast lesion"
    format: "ROI mask"
    count: 200

tasks:
  - "classification"
  - "segmentation"
  - "grading"
  - "signal_analysis"

