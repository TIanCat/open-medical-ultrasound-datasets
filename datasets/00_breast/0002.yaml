  countries:
    - "Poland"
  institutions:
    - "Institute of Oncology, Warsaw"
  period: "November 2013 to October 2015"
  scanners:
    - "Ultrasonix SonixTouch Research"
  transducers:
    - "L14-5/38 linear array"

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-02"
  sources:
    - "https://aapm.onlinelibrary.wiley.com/doi/10.1002/mp.12538"
    - "https://pubmed.ncbi.nlm.nih.gov/28859252/"
