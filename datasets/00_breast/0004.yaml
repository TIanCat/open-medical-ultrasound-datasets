notes: >-
  STU-Hospital is the public repository name rather than a formal dataset name defined
  in the paper. The 42 images constitute an external test subset of the paper's larger
  test cohort. The released masks are grayscale expert-aggregation masks rather than
  consistently binary masks, and many mask dimensions differ from the released
  128 x 128 ultrasound images. The repository does not provide patient-level metadata,
  per-image benign/malignant labels, a formal dataset license, or official preprocessing
  instructions.