data:
  repository: "Mendeley Data"
  url: "https://data.mendeley.com/datasets/k6cpmwybk3/3"
  doi: "10.17632/k6cpmwybk3.3"
  version: "3"

acquisition:
  countries:
    - "China"
  institutions:
    - "Department of Radiology, Renmin Hospital of Wuhan University"
  period: "December 2020 to December 2022"
  scanners: null
  transducers: null
  frequencies: null

family:
  type: "primary"
  parent: null
  related: []

verification:
  status: "verified"
  date: "2026-09-04"
  sources:
    - "https://data.mendeley.com/datasets/k6cpmwybk3/3"
    - "https://doi.org/10.17632/k6cpmwybk3.3"

notes: >-
  Version 3 contains 927 image-mask pairs. The patient_index field identifies 816
  patients; image-level class counts are 560 benign and 367 malignant, while
  patient-level counts are 560 benign and 256 malignant. The release provides
  patient-linked morphology and size measurements but does not document the annotation
  procedure, diagnostic reference standard, or an official train/validation/test split.
  No dedicated peer-reviewed dataset paper was identified, so the Mendeley Data DOI is
  recorded only under the data block and paper is set to null.
