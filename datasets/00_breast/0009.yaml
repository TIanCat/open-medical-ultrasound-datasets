id: "0009"
name: "BUSI_WHU"
full_name: "BUSI_WHU: Breast Cancer Ultrasound Image Dataset"
aliases: []

release_year: 2023

anatomy:
  primary: "Breast"
  target:
    - "Breast tumor"

modality:
  type:
    - "B-mode"
  dimension: "2D"
  temporal: "static"
  representation:
    - "image"

scale:
  - unit: "patient"
    count: 816
  - unit: "image"
    count: 927

annotations:
  classification:
    unit: "image"
    classes:
      - "Benign"
      - "Malignant"
    distribution:
      Benign: 560
      Malignant: 367
    reference_standard: null
    note: "Patient-level distribution is 560 benign and 256 malignant patients."

  segmentation:
    unit: "image"
    type: "binary"
    targets:
      - "Breast tumor"
    format: "mask"
    count: 927

  measurements:
    unit: "image"
    targets:
      - "Tumor area"
      - "Tumor-to-image area ratio"
      - "Tumor centroid"
      - "Maximum tumor diameter"
      - "Minimum tumor diameter"
    format: "tabular_metadata"
    note: "Measurements are provided in Patient_infos_BUSI-WHU.xlsx."

tasks:
  - "classification"
  - "segmentation"
  - "measurement"

