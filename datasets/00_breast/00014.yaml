notes: ALN-Ultra contains paired ultrasound image/video data from 257 early-stage breast cancer patients for axillary lymph node metastasis prediction. Exact image and video counts, formats, label schema, and splits cannot currently be verified because both the original and replacement Zenodo records restrict file access; the old GitHub repository and Google clinical-label sheet are unavailable. The metadata states CC BY 4.0, but current download access is restricted.