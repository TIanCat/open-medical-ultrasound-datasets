id: US014
name: ALN-Ultra
full_name: Early-stage breast cancer ultrasound dataset with paired images and videos for axillary lymph node metastasis prediction
release_year: 2025
release_year_basis: The first ALN-Ultra Zenodo record was published on 2025-03-11; a separate replacement record was published in 2026

anatomy:
  primary: Breast
  imaged_target: Breast cancer ultrasound; the live metadata does not specify whether every file depicts the primary breast lesion or axillary lymph node
  prediction_target: Axillary lymph node metastasis status

modality:
  type: Ultrasound
  components:
    - Paired static images
    - Cine/video data
  official_wording: The record describes 2D images and 3D videos
  dimensionality_caution: The accessible metadata does not establish that the videos are true volumetric 3D ultrasound rather than 2D cine with a temporal dimension
  imaging_mode: Not explicitly stated in the current Zenodo metadata
  released_formats: Not verifiable while the files are restricted

scale:
  patients: 257
  paired_image_video_records: Stated as paired by patient, but exact record count is not independently verifiable
  static_images: Not explicitly reported in the accessible metadata
  videos: Not explicitly reported in the accessible metadata
  cached_file_listing:
    total_size: 16.1 GB
    files:
      - image_pad.zip
      - labels.xlsx
      - tree.txt
      - videos(0-50).zip
      - videos(51-100).zip
      - videos(101-150).zip
      - videos(151-200).zip
      - videos(201-250).zip
      - videos(251-314).zip
    caution: Archive names suggest numeric ranges but are not sufficient evidence of patient, image, or video counts

annotations:
  expert_diagnostic_evaluations: true
  histopathological_biopsy_results: true
  target_label: Axillary lymph node metastasis status
  segmentation_masks: Not stated
  clinical_labels_file: labels.xlsx was listed in the replacement record before access became restricted
  detailed_schema: Not currently accessible
  secondary_reported_class_distribution:
    aln_negative: 128
    aln_positive: 129
    source: Radiology Artificial Intelligence 2026 evaluation; not independently verified against the restricted labels file

tasks:
  - Axillary lymph node metastasis prediction in early-stage breast cancer
  - Static-image versus video model comparison
  - Paired image-video representation learning or fusion

splits:
  official_train_validation_test_split: Not provided in the accessible dataset metadata

access:
  level: restricted
  record_visible_without_login: true
  files_require_login_or_access_request: true
  license_metadata: CC BY 4.0
  caution: A Creative Commons license in record metadata does not make currently restricted files directly downloadable

paper:
  dedicated_peer_reviewed_dataset_paper: Not identified
  manuscript_title_in_original_record: A Breast Cancer Ultrasound Dataset with Paired Images and Videos for Axillary Lymph Node Metastasis Prediction
  related_article_caution: The original record cites DOI 10.3389/fonc.2023.1219838, but that article describes a different 271-patient development cohort plus a 49-patient external cohort and is not a paper for the 257-patient release
  later_external_use:
    title: Clinic-aligned Dual Distillation of Video and Image Foundation Models for Automated Breast Cancer US Diagnosis
    venue: Radiology Artificial Intelligence
    publication_year: 2026
    doi: 10.1148/ryai.250600

