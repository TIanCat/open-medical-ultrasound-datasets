quality_checks:
  original_github_status: Returned HTTP 404 on 2026-09-03
  original_google_sheet_status: Returned HTTP 410 on 2026-09-03
  original_zenodo_access: Restricted
  replacement_zenodo_access: Restricted; direct file URLs redirect to login
  archive_downloaded: false
  file_level_verification: Not possible under current access controls

family:
  type: primary
  parent: null

verified:
  date: 2026-09-03
  methods:
    - Read the Zenodo API metadata for the original record, its two-version history, and the separate 2026 replacement record
    - Tested the original GitHub and Google Sheets links
    - Tested replacement-record file URLs and confirmed redirect to Zenodo login
    - Compared the dataset metadata with the cited 2023 paper to avoid incorrectly treating it as the dataset paper
    - Used the 2026 Radiology Artificial Intelligence article only as a clearly marked secondary report of class balance
  sources:
    - https://zenodo.org/records/15003119
