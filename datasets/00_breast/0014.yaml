notes: >-
  ALN-Ultra is described as paired ultrasound image/video data from 257 patients
  with early-stage breast cancer for axillary lymph node metastasis prediction.
  The current Zenodo replacement record is publicly visible, but its files are
  restricted. Exact image and video counts, file formats, detailed label schema,
  and official splits therefore cannot currently be verified. The original 2025
  Zenodo record was 10.5281/zenodo.15003119. The current live replacement page
  does not display an explicit license value in its Rights section, so the
  license is recorded as null rather than inferred from earlier metadata.
